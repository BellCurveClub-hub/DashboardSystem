<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  /* Bell Curve Club — student palette. Ink slate carries the structure,
     highlighter yellow does the marking, coral is the peak. Deliberately
     not navy and gold: that combination reads as a bank, not a study club. */
  --ink-900:#232C45;
  --ink-800:#2E3A59;
  --ink-700:#3E4C70;
  --ink-500:#5F6B8C;
  --mint-600:#15968B;
  --mint-500:#2EC4B6;
  --mint-100:#DAF4F1;
  --hl-500:#FFE45E;   /* highlighter — backgrounds and marks only */
  --hl-600:#9A7B00;   /* the readable counterpart, for text on light */
  --hl-100:#FFF6CE;
  --coral-600:#D2492F;
  --coral-500:#F2664B;
  --coral-100:#FDE3DC;
  --lilac-500:#8B7BE8;
  --lilac-100:#EBE7FC;
  --cream:#FBF8F1;
  --cream-2:#F3EEE3;
  --paper:#FFFFFF;
  --ink:#232C45;
  --ink-soft:#5F6B8C;
  --ink-faint:#8D97AF;
  --line:#E6E0D3;
  --ok:#1F8A66;
  --ok-bg:#DFF3EC;
  --warn:#9A6A12;
  --warn-bg:#FBEFD8;
  --bad:#C0392B;
  --bad-bg:#FBE6E2;
  --shadow-sm:0 1px 2px rgba(35,44,69,.08);
  --shadow:0 6px 20px rgba(35,44,69,.10);
  --shadow-lg:0 18px 48px rgba(35,44,69,.24);
  --r-sm:8px; --r:12px; --r-lg:18px;
  --sans:"Inter","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --display:"Nunito","Segoe UI",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --sidebar-w:246px;
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--cream); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--display); font-weight:600; margin:0; letter-spacing:-.01em; color:var(--ink-800)}
h1{font-size:26px} h2{font-size:20px} h3{font-size:17px} h4{font-size:15px}
p{margin:0 0 10px}
a{color:var(--mint-600)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mint-500); outline-offset:2px; border-radius:3px}
.hidden{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ============================================================
   AUTH / GATE SCREENS
   ============================================================ */
.gate{
  min-height:100%; display:grid; place-items:center; padding:24px;
  background:
    radial-gradient(1100px 520px at 12% -10%, #3E4C70 0%, transparent 62%),
    radial-gradient(900px 480px at 100% 108%, #15968B 0%, transparent 60%),
    var(--ink-900);
}
.gate-card{
  width:100%; max-width:430px; background:var(--paper);
  border-radius:var(--r-lg); box-shadow:var(--shadow-lg); overflow:hidden;
}
.gate-head{padding:26px 28px 20px; border-bottom:1px solid var(--line); background:var(--cream)}
.gate-head .mark{display:flex; align-items:center; gap:11px}
.gate-body{padding:24px 28px 28px}
.gate-foot{padding:14px 28px; background:var(--cream-2); font-size:12.5px; color:var(--ink-soft); text-align:center}
.brandmark{
  width:46px;height:34px;flex:0 0 auto; display:block; border-radius:6px;
  background:var(--paper); padding:2px 3px;
}
.brandmark.on-dark{background:transparent; padding:0}
.brand-name{
  font-family:var(--display); font-size:20px; font-weight:800; color:var(--ink-800);
  line-height:1.1; letter-spacing:-.015em; text-transform:lowercase;
}
.brand-name .swipe{
  background:linear-gradient(180deg,transparent 42%,var(--hl-500) 42%,var(--hl-500) 92%,transparent 92%);
  padding:0 2px; border-radius:2px;
}
.brand-sub{font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--mint-600); font-weight:700}
/* The slogan runs to seven words, so it drops the uppercase and most of the
   tracking that suits a one-word eyebrow, and sets lowercase like the wordmark. */
.brand-sub.tag{font-size:12px; letter-spacing:.01em; text-transform:lowercase; font-weight:700; margin-top:1px}
.doc-foot .tag{color:var(--mint-600); font-weight:700}
.tabs-seg{display:flex; gap:4px; background:var(--cream-2); padding:4px; border-radius:9px; margin-bottom:18px}
.tabs-seg button{
  flex:1; border:0; background:transparent; padding:8px 6px; border-radius:6px;
  font-size:13.5px; font-weight:600; color:var(--ink-soft); cursor:pointer;
}
.tabs-seg button[aria-selected="true"]{background:var(--paper); color:var(--ink-800); box-shadow:var(--shadow-sm)}

/* ============================================================
   FORMS
   ============================================================ */
.field{margin-bottom:14px}
.field > label,.lbl{
  display:block; font-size:11.5px; font-weight:700; letter-spacing:.07em;
  text-transform:uppercase; color:var(--ink-soft); margin-bottom:5px;
}
.input,input[type=text],input[type=email],input[type=password],input[type=number],
input[type=date],input[type=time],input[type=tel],select,textarea{
  width:100%; padding:9px 11px; border:1px solid #D8D2C4; border-radius:var(--r-sm);
  background:var(--paper); font-size:14.5px; transition:border-color .12s, box-shadow .12s;
}
textarea{min-height:82px; resize:vertical}
.input:focus,input:focus,select:focus,textarea:focus{
  outline:none; border-color:var(--mint-500); box-shadow:0 0 0 3px rgba(27,140,158,.16);
}
input[disabled],select[disabled],textarea[disabled]{background:var(--cream-2); color:var(--ink-faint)}
.hint{font-size:12.5px; color:var(--ink-soft); margin-top:5px}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:0 14px}
.grid-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 14px}
@media (max-width:640px){.grid-2,.grid-3{grid-template-columns:1fr}}
.check{display:flex; align-items:center; gap:9px; font-size:14px; margin-bottom:9px}
.check input{width:auto; margin:0}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:9px 15px; border-radius:var(--r-sm); border:1px solid transparent;
  font-size:14px; font-weight:600; cursor:pointer; background:var(--cream-2); color:var(--ink-800);
  transition:background .12s, border-color .12s, transform .06s; text-decoration:none; white-space:nowrap;
}
.btn:hover{background:#EAE4D7}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn-primary{background:var(--ink-800); color:#fff}
.btn-primary:hover{background:var(--ink-700)}
.btn-mint{background:var(--mint-600); color:#fff}
.btn-mint:hover{background:var(--mint-500)}
.btn-hl{background:var(--hl-500); color:#3A2E00}
.btn-hl:hover{background:var(--hl-600); color:#fff}
.btn-ghost{background:transparent; border-color:#D8D2C4}
.btn-ghost:hover{background:var(--cream-2)}
.btn-danger{background:var(--bad-bg); color:var(--bad); border-color:#F3CFC8}
.btn-danger:hover{background:#F8DAD3}
.btn-sm{padding:5px 10px; font-size:12.5px}
.btn-lg{padding:12px 20px; font-size:15px; width:100%}
.btn-row{display:flex; gap:8px; flex-wrap:wrap}

/* ============================================================
   APP SHELL
   ============================================================ */
.app{display:grid; grid-template-columns:var(--sidebar-w) 1fr; min-height:100vh}
.side{
  background:var(--ink-900); color:#C7CEE0; display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh; border-right:1px solid #1B2337;
}
.side-head{padding:18px 18px 16px; border-bottom:1px solid #33405F; display:flex; gap:11px; align-items:center}
.side-head .brand-name{color:#fff; font-size:16px}
.side-head .brand-sub{color:var(--hl-500); font-size:10px}
.side-nav{flex:1; overflow-y:auto; padding:12px 10px}
.nav-group{font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:#7C87A5; padding:14px 10px 6px; font-weight:700}
.nav-item{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:9px 11px; border:0; background:transparent; color:#BCC4DA;
  border-radius:var(--r-sm); cursor:pointer; font-size:14px; margin-bottom:2px;
  border-left:3px solid transparent;
}
.nav-item:hover{background:#333F5E; color:#fff}
.nav-item.active{background:#3B486A; color:#fff; border-left-color:var(--coral-500); font-weight:600}
.nav-item .ic{width:18px; text-align:center; font-size:14px; opacity:.9}
.nav-item .badge-n{
  margin-left:auto; background:var(--coral-500); color:#fff; font-size:11px;
  font-weight:700; padding:1px 7px; border-radius:999px;
}
.side-foot{padding:12px; border-top:1px solid #33405F; font-size:12.5px}
.side-user{display:flex; align-items:center; gap:9px; margin-bottom:9px}
.avatar{
  width:32px;height:32px;border-radius:50%; background:var(--lilac-500); color:#fff;
  display:grid; place-items:center; font-weight:700; font-size:13px; flex:0 0 auto;
}
.side-user .nm{color:#fff; font-weight:600; line-height:1.2; font-size:13.5px}
.side-user .rl{color:var(--mint-500); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; font-weight:700}

.main{min-width:0; display:flex; flex-direction:column}
.topbar{
  background:var(--paper); border-bottom:1px solid var(--line); padding:14px 26px;
  display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:20;
}
.topbar .spacer{flex:1}
.burger{display:none; border:1px solid #D8D2C4; background:var(--paper); border-radius:var(--r-sm); padding:6px 10px; cursor:pointer}
.view{padding:22px 26px 60px; max-width:1240px; width:100%}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed; z-index:60; width:var(--sidebar-w); transform:translateX(-100%); transition:transform .2s}
  .side.open{transform:none; box-shadow:var(--shadow-lg)}
  .burger{display:block}
  .view{padding:16px 14px 60px}
  .topbar{padding:12px 14px}
}
.scrim{position:fixed; inset:0; background:rgba(7,26,44,.5); z-index:50}

/* ============================================================
   CARDS / LAYOUT PRIMITIVES
   ============================================================ */
.card{background:var(--paper); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow-sm); margin-bottom:18px}
.card-head{padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.card-head .spacer{flex:1}
.card-body{padding:18px}
.card-body.tight{padding:0}
.page-head{display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap; margin-bottom:18px}
.page-head .spacer{flex:1}
.page-head .sub{color:var(--ink-soft); font-size:13.5px; margin-top:3px}
.cols{display:grid; gap:18px}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.cols-3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.cols-4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.stack{display:flex; flex-direction:column; gap:10px}
.row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}

/* stat tile */
.stat{background:var(--paper); border:1px solid var(--line); border-radius:var(--r); padding:15px 16px; box-shadow:var(--shadow-sm)}
.stat .k{font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); font-weight:700}
.stat .v{font-family:var(--display); font-size:30px; font-weight:600; color:var(--ink-800); line-height:1.15; margin-top:4px}
.stat .n{font-size:12.5px; color:var(--ink-soft); margin-top:2px}
.stat.alert{border-color:#EFD59A; background:var(--warn-bg)}
.stat.alert .v{color:var(--warn)}

/* ============================================================
   SIGNATURE: LESSON CREDIT STRIP
   A prepaid balance drawn as physical lesson tickets — each
   remaining lesson is a tick, used lessons are torn stubs.
   ============================================================ */
.credit-strip{display:flex; align-items:flex-end; gap:3px; height:34px; margin:8px 0 6px}
.credit-strip i{
  display:block; width:9px; border-radius:2px 2px 1px 1px;
  background:linear-gradient(180deg,var(--mint-500),var(--mint-600));
  height:100%; box-shadow:inset 0 -3px 0 rgba(0,0,0,.12);
}
.credit-strip i.spent{background:var(--cream-2); box-shadow:inset 0 0 0 1px var(--line); height:56%}
.credit-strip i.low{background:linear-gradient(180deg,#FFE45E,var(--hl-600))}
.credit-strip i.none{background:#F6CFC6; box-shadow:inset 0 0 0 1px #EEB6A8}
.credit-line{display:flex; align-items:baseline; gap:8px}
.credit-line b{font-family:var(--display); font-size:26px; color:var(--ink-800); font-weight:600}
.credit-line span{font-size:12.5px; color:var(--ink-soft)}

/* ============================================================
   TABLES
   ============================================================ */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%; border-collapse:collapse; font-size:14px}
table.tbl th{
  text-align:left; padding:9px 14px; background:var(--cream); color:var(--ink-soft);
  font-size:11px; letter-spacing:.08em; text-transform:uppercase; font-weight:700;
  border-bottom:1px solid var(--line); white-space:nowrap;
}
table.tbl td{padding:10px 14px; border-bottom:1px solid #F1ECE1; vertical-align:middle}
table.tbl tbody tr:hover{background:#FDFBF6}
table.tbl tbody tr:last-child td{border-bottom:0}
table.tbl td.num,table.tbl th.num{text-align:right; font-variant-numeric:tabular-nums}
table.tbl td.act{text-align:right; white-space:nowrap}
table.tbl td.drag-handle{width:1%; padding-right:4px; cursor:grab; color:var(--ink-faint); font-size:15px}
table.tbl tr[draggable="true"].dragging{opacity:.4}
table.tbl tr[draggable="true"]:active .drag-handle{cursor:grabbing}
.empty{padding:36px 20px; text-align:center; color:var(--ink-soft)}
.empty .big{font-size:30px; margin-bottom:8px; opacity:.55}
.empty h4{margin-bottom:5px}

/* ============================================================
   PILLS / BADGES
   ============================================================ */
.pill{
  display:inline-block; padding:2px 9px; border-radius:999px; font-size:11.5px;
  font-weight:700; letter-spacing:.03em; background:var(--cream-2); color:var(--ink-soft);
  border:1px solid var(--line); white-space:nowrap;
}
.pill.ok{background:var(--ok-bg); color:var(--ok); border-color:#BFE6D6}
.pill.warn{background:var(--warn-bg); color:var(--warn); border-color:#EFDCB2}
.pill.bad{background:var(--bad-bg); color:var(--bad); border-color:#F3CFC8}
.pill.info{background:var(--mint-100); color:var(--mint-600); border-color:#B6E6DF}
.pill.hl{background:var(--hl-100); color:var(--hl-600); border-color:#EBD48A}
.pill.ink{background:#E5E8F1; color:var(--ink-700); border-color:#CCD2E2}

/* ============================================================
   SCHEDULE
   ============================================================ */
.week-grid{display:grid; grid-template-columns:repeat(7,minmax(128px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.week-col{background:var(--paper); min-height:150px; padding:0 0 8px}
.week-col > .dh{
  padding:8px 10px; background:var(--cream); border-bottom:1px solid var(--line);
  font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); font-weight:700;
}
.week-col.today > .dh{background:var(--ink-800); color:#fff}
.week-col.today > .dh b{color:var(--hl-500)}
.sess{
  margin:7px 7px 0; padding:8px 9px; border-radius:var(--r-sm); background:var(--cream);
  border-left:3px solid var(--mint-600); cursor:pointer; transition:background .12s;
}
.sess:hover{background:var(--mint-100)}
.sess.adhoc{border-left-color:var(--coral-500); background:#FFF4F1}
.sess.cancelled{opacity:.5; border-left-color:var(--bad); text-decoration:line-through}
.sess .t{font-size:11.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums; font-weight:600}
.sess .n{font-size:13px; font-weight:600; color:var(--ink-800); line-height:1.25; margin:1px 0}
.sess .m{font-size:11.5px; color:var(--ink-soft)}
.slot-chip{
  margin:5px 7px 0; padding:6px 8px; border-radius:var(--r-sm); font-size:11.5px;
  font-weight:600; text-align:center; font-variant-numeric:tabular-nums;
}
.slot-chip.free{background:var(--mint-100); color:var(--mint-600); cursor:pointer; transition:background .12s}
.slot-chip.free:hover{background:#BFEAE4}
.slot-chip.busy{background:#FBEAE7; color:#B23A2A; opacity:.7; cursor:not-allowed}

/* ============================================================
   PROGRESS / MASTERY
   ============================================================ */
.mastery{display:flex; flex-direction:column; gap:11px}
.mrow{display:grid; grid-template-columns:1fr 132px 46px; gap:11px; align-items:center}
.mrow.adm{grid-template-columns:1fr 132px 46px 96px}
@media (max-width:560px){.mrow{grid-template-columns:1fr 80px 40px}.mrow.adm{grid-template-columns:1fr 70px 38px 78px}}
.mrow .nm{font-size:13.5px}
.mrow .nm small{display:block; color:var(--ink-faint); font-size:11.5px}
.bar{height:9px; background:var(--cream-2); border-radius:999px; overflow:hidden}
.bar i{display:block; height:100%; border-radius:999px; background:var(--mint-600); transition:width .35s ease}
.bar i.b4{background:#1F8A66} .bar i.b3{background:var(--mint-600)}
.bar i.b2{background:#E8B93A} .bar i.b1{background:#E08A2E} .bar i.b0{background:var(--bad)}
.mrow .pc{text-align:right; font-variant-numeric:tabular-nums; font-weight:700; font-size:13.5px; color:var(--ink-800)}

/* ============================================================
   REWARDS
   ============================================================ */
.gifts{display:grid; grid-template-columns:repeat(auto-fill,minmax(178px,1fr)); gap:14px}
.gift{background:var(--paper); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; display:flex; flex-direction:column; box-shadow:var(--shadow-sm)}
.gift .art{height:96px; display:grid; place-items:center; font-size:42px; background:linear-gradient(160deg,var(--hl-100),var(--mint-100))}
.gift .bd{padding:11px 12px; flex:1; display:flex; flex-direction:column; gap:5px}
.gift .nm{font-weight:600; font-size:14px; line-height:1.25}
.gift .ds{font-size:12px; color:var(--ink-soft); flex:1}
.gift .ft{display:flex; align-items:center; gap:8px; padding-top:4px}
.gift .cost{font-family:var(--display); font-weight:700; color:var(--hl-600); font-size:16px}
.points-badge{
  display:inline-flex; align-items:center; gap:6px; background:var(--hl-100);
  border:1px solid #EBD48A; color:var(--hl-600); font-weight:700;
  padding:4px 11px; border-radius:999px; font-size:13.5px;
}

/* ============================================================
   MODAL
   ============================================================ */
.modal-scrim{position:fixed; inset:0; background:rgba(7,26,44,.55); display:grid; place-items:center; z-index:100; padding:18px; overflow-y:auto}
.modal{background:var(--paper); border-radius:var(--r-lg); box-shadow:var(--shadow-lg); width:100%; max-width:540px; max-height:92vh; display:flex; flex-direction:column; margin:auto}
.modal.wide{max-width:860px}
.modal-head{padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px}
.modal-head .spacer{flex:1}
.modal-body{padding:20px; overflow-y:auto}
.modal-foot{padding:14px 20px; border-top:1px solid var(--line); display:flex; gap:9px; justify-content:flex-end; background:var(--cream); border-radius:0 0 var(--r-lg) var(--r-lg)}
.x-btn{border:0; background:transparent; font-size:21px; line-height:1; cursor:pointer; color:var(--ink-faint); padding:2px 6px}
.x-btn:hover{color:var(--ink)}

/* ============================================================
   TOASTS
   ============================================================ */
.toasts{position:fixed; right:16px; bottom:16px; z-index:200; display:flex; flex-direction:column; gap:9px; max-width:340px}
.toast{background:var(--ink-800); color:#fff; padding:11px 15px; border-radius:var(--r); box-shadow:var(--shadow-lg); font-size:14px; animation:tin .18s ease}
.toast.ok{background:#177A5A} .toast.bad{background:#B03325}
@keyframes tin{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}

/* ============================================================
   MISC
   ============================================================ */
.code{
  font-family:var(--mono); font-size:12px; line-height:1.55; background:var(--ink-900);
  color:#D9DEEC; padding:16px; border-radius:var(--r); overflow:auto; max-height:440px;
  white-space:pre; -moz-tab-size:2; tab-size:2;
}
.note{border-left:3px solid var(--mint-600); background:var(--mint-100); padding:11px 14px; border-radius:0 var(--r-sm) var(--r-sm) 0; font-size:13.5px; margin-bottom:14px}
.note.hl{border-left-color:var(--hl-500); background:var(--hl-100)}
.note.bad{border-left-color:var(--bad); background:var(--bad-bg)}
.divider{height:1px; background:var(--line); margin:16px 0}
.money{font-variant-numeric:tabular-nums; font-weight:600}
.filters{display:flex; gap:9px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px}
.filters .field{margin:0; min-width:150px}
.spin{width:17px;height:17px;border:2px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:sp .7s linear infinite; display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{padding:44px; text-align:center; color:var(--ink-soft)}
.kid-tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px}
.kid-tab{border:1px solid var(--line); background:var(--paper); padding:8px 14px; border-radius:999px; cursor:pointer; font-size:13.5px; font-weight:600; color:var(--ink-soft)}
.kid-tab[aria-selected="true"]{background:var(--ink-800); color:#fff; border-color:var(--ink-800)}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink-soft)}
.legend i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px}

/* ============================================================
   PRINTABLE DOCUMENT (invoice / receipt)
   Rendered into #printdoc and shown on its own for printing.
   ============================================================ */
#printdoc{display:none}
.doc{
  background:var(--paper); color:var(--ink); width:100%; max-width:760px; margin:0 auto;
  padding:34px 38px; font-size:13.5px; line-height:1.55;
}
.doc-top{display:flex; gap:20px; align-items:flex-start; border-bottom:2px solid var(--ink-800); padding-bottom:16px}
.doc-top .spacer{flex:1}
.doc-title{font-family:var(--display); font-size:30px; color:var(--ink-800); letter-spacing:.01em; line-height:1.1}
.doc-title small{display:block; font-family:var(--sans); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--mint-600); font-weight:700; margin-top:5px}
.doc-meta{margin-top:6px; font-size:12.5px; color:var(--ink-soft); text-align:right}
.doc-meta b{color:var(--ink)}
.doc-parties{display:grid; grid-template-columns:1fr 1fr; gap:24px; margin:22px 0}
.doc-parties .lbl{margin-bottom:4px}
.doc table{width:100%; border-collapse:collapse; margin:8px 0 0}
.doc table th{
  text-align:left; padding:8px 10px; background:var(--ink-800); color:#fff;
  font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; font-weight:700;
}
.doc table th.num,.doc table td.num{text-align:right}
.doc table td{padding:10px; border-bottom:1px solid var(--line); vertical-align:top}
.doc .totals{margin-top:14px; margin-left:auto; width:290px}
.doc .totals div{display:flex; justify-content:space-between; padding:6px 0}
.doc .totals .grand{
  border-top:2px solid var(--ink-800); margin-top:4px; padding-top:9px;
  font-family:var(--display); font-size:19px; font-weight:600; color:var(--ink-800);
}
.doc .pay{margin-top:26px; border:1px solid var(--line); border-left:3px solid var(--hl-500); background:var(--cream); padding:14px 16px; border-radius:0 var(--r-sm) var(--r-sm) 0}
.doc .pay h4{margin-bottom:6px}
.doc .stamp{
  border:3px solid var(--ok); color:var(--ok); font-family:var(--display); font-weight:700;
  font-size:19px; letter-spacing:.09em; padding:7px 18px; border-radius:6px;
  transform:rotate(-7deg); display:inline-block; text-transform:uppercase;
}
.doc .stamp.void{border-color:var(--bad); color:var(--bad)}
.doc-foot{margin-top:30px; padding-top:14px; border-top:1px solid var(--line); font-size:11.5px; color:var(--ink-soft); text-align:center}

body.printing #root{display:none}
body.printing #printdoc{display:block; background:var(--paper)}
body.printing .toasts,body.printing #modal-host{display:none}
@media print{
  @page{margin:14mm}
  body{background:#fff}
  #root,.toasts,#modal-host{display:none !important}
  #printdoc{display:block !important}
  .doc{max-width:none; padding:0; box-shadow:none}
  .no-print{display:none !important}
}

<div id="root"><div class="loading">Loading…</div></div>
<div class="toasts" id="toasts"></div>
<div id="modal-host"></div>
<div id="printdoc"></div>
<script>

/* ============================================================================
   SETUP PAYLOAD 1 of 2 — Postgres schema, row-level security, triggers, seed.
   Paste into Supabase → SQL Editor → Run. Safe to re-run.
   ========================================================================== */
const SQL_SCHEMA = String.raw`
-- ===========================================================================
-- Bell Curve Club — Centre Portal schema
-- Roles: admin / parent / student.  Billing: prepaid lesson credits.
-- ===========================================================================
create extension if not exists pgcrypto;

-- ---------------------------------------------------------------- enums ----
do $$ begin create type user_role         as enum ('admin','parent','student');                      exception when duplicate_object then null; end $$;
do $$ begin create type session_status    as enum ('scheduled','completed','cancelled');             exception when duplicate_object then null; end $$;
do $$ begin create type booking_status    as enum ('requested','confirmed','waitlisted','cancelled','rejected'); exception when duplicate_object then null; end $$;
do $$ begin create type attendance_status as enum ('present','late','absent','excused');             exception when duplicate_object then null; end $$;
do $$ begin create type invoice_status    as enum ('draft','sent','paid','void');                    exception when duplicate_object then null; end $$;
do $$ begin create type redemption_status as enum ('pending','approved','collected','rejected');     exception when duplicate_object then null; end $$;
do $$ begin create type homework_status   as enum ('assigned','submitted','graded');                 exception when duplicate_object then null; end $$;

-- --------------------------------------------------------------- tables ----
create table if not exists profiles (
  id          uuid primary key references auth.users(id) on delete cascade,
  role        user_role not null default 'parent',
  full_name   text not null default '',
  email       text,
  phone       text,
  is_active   boolean not null default true,
  created_at  timestamptz not null default now()
);

create table if not exists students (
  id            uuid primary key default gen_random_uuid(),
  profile_id    uuid references profiles(id) on delete set null,   -- the child's own login
  parent_id     uuid references profiles(id) on delete set null,   -- the paying parent
  full_name     text not null,
  level         text,
  school        text,
  credits       numeric(8,1) not null default 0,
  points        integer not null default 0,
  low_credit_at numeric(8,1) not null default 2,
  notes         text,
  is_active     boolean not null default true,
  created_at    timestamptz not null default now()
);
create index if not exists students_parent_idx  on students(parent_id);
create index if not exists students_profile_idx on students(profile_id);

create table if not exists subjects (
  id     uuid primary key default gen_random_uuid(),
  name   text not null unique,
  colour text not null default '#2EC4B6'
);

create table if not exists topics (
  id         uuid primary key default gen_random_uuid(),
  subject_id uuid references subjects(id) on delete cascade,
  level      text,
  name       text not null,
  sort_order int not null default 0
);
create index if not exists topics_subject_idx on topics(subject_id);

create table if not exists classes (
  id                  uuid primary key default gen_random_uuid(),
  name                text not null,
  subject_id          uuid references subjects(id) on delete set null,
  level               text,
  tutor_name          text,
  room                text,
  kind                text not null default 'fixed' check (kind in ('fixed','adhoc')),
  day_of_week         int check (day_of_week between 0 and 6),   -- 0 = Sunday, fixed classes only
  start_time          time,
  end_time            time,
  capacity            int not null default 8,
  credits_per_session numeric(4,1) not null default 1,
  is_active           boolean not null default true,
  created_at          timestamptz not null default now()
);

create table if not exists sessions (
  id           uuid primary key default gen_random_uuid(),
  class_id     uuid not null references classes(id) on delete cascade,
  session_date date not null,
  start_time   time not null,
  end_time     time not null,
  capacity     int not null default 8,
  status       session_status not null default 'scheduled',
  is_bookable  boolean not null default false,   -- true = open slot anyone may request
  tutor_name   text,
  room         text,
  notes        text,
  created_at   timestamptz not null default now(),
  unique (class_id, session_date, start_time)
);
create index if not exists sessions_date_idx on sessions(session_date);

create table if not exists enrolments (
  id         uuid primary key default gen_random_uuid(),
  student_id uuid not null references students(id) on delete cascade,
  class_id   uuid not null references classes(id) on delete cascade,
  start_date date not null default current_date,
  end_date   date,
  status     text not null default 'active' check (status in ('active','ended')),
  created_at timestamptz not null default now(),
  unique (student_id, class_id)
);

create table if not exists bookings (
  id         uuid primary key default gen_random_uuid(),
  session_id uuid not null references sessions(id) on delete cascade,
  student_id uuid not null references students(id) on delete cascade,
  status     booking_status not null default 'requested',
  booked_by  uuid references profiles(id) on delete set null,
  note       text,
  created_at timestamptz not null default now(),
  unique (session_id, student_id)
);
create index if not exists bookings_session_idx on bookings(session_id);

create table if not exists attendance (
  id              uuid primary key default gen_random_uuid(),
  session_id      uuid not null references sessions(id) on delete cascade,
  student_id      uuid not null references students(id) on delete cascade,
  status          attendance_status not null default 'present',
  credits_charged numeric(4,1) not null default 0,
  marked_by       uuid references profiles(id) on delete set null,
  marked_at       timestamptz not null default now(),
  unique (session_id, student_id)
);

-- a family flagging, ahead of time, that a student will miss a fixed weekly
-- session — the notice-window check lives in report_absence(), not here
create table if not exists absence_reports (
  id                   uuid primary key default gen_random_uuid(),
  session_id           uuid not null references sessions(id) on delete cascade,
  student_id           uuid not null references students(id) on delete cascade,
  reported_by          uuid references profiles(id) on delete set null,
  reported_at          timestamptz not null default now(),
  redeemed_booking_id  uuid references bookings(id) on delete set null,
  created_at           timestamptz not null default now(),
  unique (session_id, student_id)
);
create index if not exists absence_reports_student_idx on absence_reports(student_id);

create table if not exists packages (
  id            uuid primary key default gen_random_uuid(),
  name          text not null,
  lessons       int not null,
  price_cents   int not null,
  subject_id    uuid references subjects(id) on delete set null,
  is_active     boolean not null default true
);

create sequence if not exists invoice_seq start 1000;

create table if not exists invoices (
  id                uuid primary key default gen_random_uuid(),
  invoice_no        text not null unique default ('INV-' || to_char(now(),'YYYY') || '-' || lpad(nextval('invoice_seq')::text,4,'0')),
  student_id        uuid references students(id) on delete set null,
  parent_id         uuid references profiles(id) on delete set null,
  package_id        uuid references packages(id) on delete set null,
  description       text,
  lessons           numeric(6,1) not null default 0,
  amount_cents      int not null,
  status            invoice_status not null default 'draft',
  issued_at         date not null default current_date,
  due_at            date,
  paid_at           timestamptz,
  payment_ref       text,
  hitpay_request_id text,
  hitpay_url        text,
  created_at        timestamptz not null default now()
);
create index if not exists invoices_parent_idx  on invoices(parent_id);
create index if not exists invoices_student_idx on invoices(student_id);

create table if not exists credit_ledger (
  id         uuid primary key default gen_random_uuid(),
  student_id uuid not null references students(id) on delete cascade,
  delta      numeric(8,1) not null,
  reason     text not null,
  ref_table  text,
  ref_id     uuid,
  created_by uuid references profiles(id) on delete set null,
  created_at timestamptz not null default now()
);
create index if not exists credit_ledger_student_idx on credit_ledger(student_id, created_at desc);

create table if not exists points_ledger (
  id         uuid primary key default gen_random_uuid(),
  student_id uuid not null references students(id) on delete cascade,
  delta      integer not null,
  reason     text not null,
  ref_table  text,
  ref_id     uuid,
  created_at timestamptz not null default now()
);
create index if not exists points_ledger_student_idx on points_ledger(student_id, created_at desc);

create table if not exists rewards (
  id          uuid primary key default gen_random_uuid(),
  name        text not null,
  description text,
  icon        text not null default 'gift',
  points_cost int not null,
  stock       int not null default 0,
  is_active   boolean not null default true
);

create table if not exists redemptions (
  id           uuid primary key default gen_random_uuid(),
  student_id   uuid not null references students(id) on delete cascade,
  reward_id    uuid not null references rewards(id) on delete restrict,
  points_spent int not null,
  status       redemption_status not null default 'pending',
  note         text,
  requested_at timestamptz not null default now(),
  handled_at   timestamptz,
  handled_by   uuid references profiles(id) on delete set null
);

create table if not exists homework (
  id           uuid primary key default gen_random_uuid(),
  student_id   uuid not null references students(id) on delete cascade,
  class_id     uuid references classes(id) on delete set null,
  topic_id     uuid references topics(id) on delete set null,
  title        text not null,
  instructions text,
  assigned_at  date not null default current_date,
  due_at       date,
  status       homework_status not null default 'assigned',
  submitted_at timestamptz,
  score        numeric(6,2),
  max_score    numeric(6,2) not null default 100,
  feedback     text,
  graded_at    timestamptz,
  graded_by    uuid references profiles(id) on delete set null,
  created_at   timestamptz not null default now()
);
create index if not exists homework_student_idx on homework(student_id, due_at);

create table if not exists topic_mastery (
  student_id   uuid not null references students(id) on delete cascade,
  topic_id     uuid not null references topics(id) on delete cascade,
  score        numeric(5,1) not null default 0,
  samples      int not null default 0,
  manual_score numeric(5,1),
  updated_at   timestamptz not null default now(),
  primary key (student_id, topic_id)
);

create table if not exists settings (
  key   text primary key,
  value jsonb not null
);

-- --------------------------------------------------- later additions ------
-- Kept as ALTERs so an existing database picks them up on a re-run.
alter table invoices      add column if not exists payment_method text;
alter table invoices      add column if not exists paid_amount_cents int;

-- ------------------------------------------------------------ functions ----
create or replace function setting_int(p_key text, p_default int)
returns int language sql stable as $$
  select coalesce((select (value->>'n')::int from settings where key = p_key), p_default);
$$;

create or replace function is_admin() returns boolean
language sql stable security definer set search_path = public as $$
  select exists (select 1 from profiles where id = auth.uid() and role = 'admin');
$$;

create or replace function my_student_ids() returns setof uuid
language sql stable security definer set search_path = public as $$
  select id from students where parent_id = auth.uid() or profile_id = auth.uid();
$$;

-- new auth user -> profile row (role comes from sign-up metadata)
create or replace function fn_new_user() returns trigger
language plpgsql security definer set search_path = public as $$
begin
  insert into profiles (id, role, full_name, email, phone)
  values (
    new.id,
    -- never trust sign-up metadata for privilege: admins are promoted by hand
    case when new.raw_user_meta_data->>'role' = 'student' then 'student'::user_role
         else 'parent'::user_role end,
    coalesce(new.raw_user_meta_data->>'full_name',''),
    new.email,
    new.raw_user_meta_data->>'phone'
  )
  on conflict (id) do nothing;
  return new;
end $$;
drop trigger if exists trg_new_user on auth.users;
create trigger trg_new_user after insert on auth.users
for each row execute function fn_new_user();

-- a user may edit their own profile, but not their own role or active flag
create or replace function fn_profile_guard() returns trigger
language plpgsql security definer set search_path = public as $$
begin
  -- only guard signed-in app sessions; direct database access (SQL editor,
  -- table editor, service role) is already fully privileged, and this is
  -- how the very first admin gets promoted
  if auth.uid() is not null and not is_admin() then
    new.role := old.role;
    new.is_active := old.is_active;
  end if;
  return new;
end $$;
drop trigger if exists trg_profile_guard on profiles;
create trigger trg_profile_guard before update on profiles
for each row execute function fn_profile_guard();

-- ledger -> running balance
create or replace function fn_credit_balance() returns trigger
language plpgsql security definer set search_path = public as $$
begin
  update students set credits = credits + new.delta where id = new.student_id;
  return new;
end $$;
drop trigger if exists trg_credit_balance on credit_ledger;
create trigger trg_credit_balance after insert on credit_ledger
for each row execute function fn_credit_balance();

create or replace function fn_points_balance() returns trigger
language plpgsql security definer set search_path = public as $$
begin
  update students set points = points + new.delta where id = new.student_id;
  return new;
end $$;
drop trigger if exists trg_points_balance on points_ledger;
create trigger trg_points_balance after insert on points_ledger
for each row execute function fn_points_balance();

-- attendance -> charge credits, award points, reverse cleanly on correction
create or replace function fn_attendance_effects() returns trigger
language plpgsql security definer set search_path = public as $$
declare v_cost numeric(4,1); v_pts int;
begin
  select c.credits_per_session into v_cost
    from sessions s join classes c on c.id = s.class_id
   where s.id = new.session_id;
  v_cost := coalesce(v_cost, 1);
  v_pts  := setting_int('points_attendance', 10);

  -- newly counts as attended
  if new.status in ('present','late')
     and (tg_op = 'INSERT' or old.status not in ('present','late')) then
    insert into credit_ledger (student_id, delta, reason, ref_table, ref_id, created_by)
    values (new.student_id, -v_cost, 'Lesson attended', 'attendance', new.id, auth.uid());
    insert into points_ledger (student_id, delta, reason, ref_table, ref_id)
    values (new.student_id, v_pts, 'Attended a lesson', 'attendance', new.id);
    new.credits_charged := v_cost;

  -- no longer counts as attended -> refund the credit and the points
  elsif tg_op = 'UPDATE' and old.status in ('present','late')
        and new.status not in ('present','late') then
    insert into credit_ledger (student_id, delta, reason, ref_table, ref_id, created_by)
    values (new.student_id, coalesce(old.credits_charged, v_cost), 'Attendance corrected', 'attendance', new.id, auth.uid());
    insert into points_ledger (student_id, delta, reason, ref_table, ref_id)
    values (new.student_id, -v_pts, 'Attendance corrected', 'attendance', new.id);
    new.credits_charged := 0;
  end if;
  return new;
end $$;
create or replace function fn_attendance_deleted() returns trigger
language plpgsql security definer set search_path = public as $$
begin
  if coalesce(old.credits_charged, 0) > 0 then
    insert into credit_ledger (student_id, delta, reason, ref_table, ref_id, created_by)
    values (old.student_id, old.credits_charged, 'Attendance mark removed', 'attendance', old.id, auth.uid());
    insert into points_ledger (student_id, delta, reason, ref_table, ref_id)
    values (old.student_id, -setting_int('points_attendance', 10), 'Attendance mark removed', 'attendance', old.id);
  end if;
  return old;
end $$;
drop trigger if exists trg_attendance_deleted on attendance;
create trigger trg_attendance_deleted after delete on attendance
for each row execute function fn_attendance_deleted();

drop trigger if exists trg_attendance_effects on attendance;
create trigger trg_attendance_effects before insert or update on attendance
for each row execute function fn_attendance_effects();

-- invoice paid -> top up lesson credits
create or replace function fn_invoice_paid() returns trigger
language plpgsql security definer set search_path = public as $$
begin
  if new.status = 'paid' and coalesce(old.status,'draft') <> 'paid' and new.student_id is not null then
    if new.paid_at is null then new.paid_at := now(); end if;
    if new.paid_amount_cents is null then new.paid_amount_cents := new.amount_cents; end if;
    -- lesson credits never expire: no end date is recorded against them
    insert into credit_ledger (student_id, delta, reason, ref_table, ref_id)
    values (new.student_id, new.lessons, 'Package paid — ' || new.invoice_no, 'invoices', new.id);
  end if;
  return new;
end $$;
drop trigger if exists trg_invoice_paid on invoices;
create trigger trg_invoice_paid before update on invoices
for each row execute function fn_invoice_paid();

-- redemption -> hold points on request, return them if rejected
create or replace function fn_redemption_effects() returns trigger
language plpgsql security definer set search_path = public as $$
declare v_pts int; v_stock int;
begin
  if tg_op = 'INSERT' then
    select points_cost, stock into v_pts, v_stock from rewards where id = new.reward_id;
    if v_stock <= 0 then raise exception 'That gift is out of stock.'; end if;
    if (select points from students where id = new.student_id) < v_pts then
      raise exception 'Not enough points for this gift.';
    end if;
    new.points_spent := v_pts;
    new.status := 'pending';   -- never let the caller pick this
    insert into points_ledger (student_id, delta, reason, ref_table, ref_id)
    values (new.student_id, -v_pts, 'Gift requested', 'redemptions', new.id);
    update rewards set stock = stock - 1 where id = new.reward_id;

  elsif tg_op = 'UPDATE' and new.status = 'rejected' and old.status <> 'rejected' then
    insert into points_ledger (student_id, delta, reason, ref_table, ref_id)
    values (new.student_id, new.points_spent, 'Gift request declined', 'redemptions', new.id);
    update rewards set stock = stock + 1 where id = new.reward_id;
    new.handled_at := now();
  elsif tg_op = 'UPDATE' and new.status <> old.status then
    new.handled_at := now();
  end if;
  return new;
end $$;
drop trigger if exists trg_redemption_effects on redemptions;
create trigger trg_redemption_effects before insert or update on redemptions
for each row execute function fn_redemption_effects();

-- topic mastery: rolling average of the 8 most recent graded pieces
create or replace function recompute_mastery(p_student uuid, p_topic uuid) returns void
language plpgsql security definer set search_path = public as $$
declare v_avg numeric(5,1); v_n int;
begin
  select round(avg(pct)::numeric, 1), count(*) into v_avg, v_n
  from (
    select (score / nullif(max_score, 0)) * 100 as pct
    from homework
    where student_id = p_student and topic_id = p_topic
      and status = 'graded' and score is not null
    order by coalesce(graded_at, now()) desc
    limit 8
  ) t;

  if v_n is null or v_n = 0 then
    delete from topic_mastery where student_id = p_student and topic_id = p_topic and manual_score is null;
    return;
  end if;

  insert into topic_mastery (student_id, topic_id, score, samples, updated_at)
  values (p_student, p_topic, least(v_avg, 100), v_n, now())
  on conflict (student_id, topic_id)
  do update set score = excluded.score, samples = excluded.samples, updated_at = now();
end $$;

create or replace function fn_homework_effects() returns trigger
language plpgsql security definer set search_path = public as $$
declare v_pct numeric;
begin
  if tg_op = 'UPDATE' and new.status = 'submitted' and old.status = 'assigned' then
    if new.submitted_at is null then new.submitted_at := now(); end if;
    insert into points_ledger (student_id, delta, reason, ref_table, ref_id)
    values (new.student_id,
            case when new.due_at is null or new.submitted_at::date <= new.due_at
                 then setting_int('points_homework_ontime', 8)
                 else setting_int('points_homework_late', 3) end,
            'Homework handed in', 'homework', new.id);
  end if;

  if new.status = 'graded' and coalesce(old.status,'assigned') <> 'graded' and new.score is not null then
    if new.graded_at is null then new.graded_at := now(); end if;
    v_pct := (new.score / nullif(new.max_score, 0)) * 100;
    if v_pct >= 80 then
      insert into points_ledger (student_id, delta, reason, ref_table, ref_id)
      values (new.student_id, setting_int('points_score_80', 10), 'Scored 80% or above', 'homework', new.id);
    end if;
    if v_pct >= 100 then
      insert into points_ledger (student_id, delta, reason, ref_table, ref_id)
      values (new.student_id, setting_int('points_score_100', 5), 'Full marks', 'homework', new.id);
    end if;
  end if;
  return new;
end $$;
drop trigger if exists trg_homework_effects on homework;
create trigger trg_homework_effects before update on homework
for each row execute function fn_homework_effects();

create or replace function fn_homework_mastery() returns trigger
language plpgsql security definer set search_path = public as $$
begin
  if new.topic_id is not null then perform recompute_mastery(new.student_id, new.topic_id); end if;
  if tg_op = 'UPDATE' and old.topic_id is not null and old.topic_id is distinct from new.topic_id then
    perform recompute_mastery(old.student_id, old.topic_id);
  end if;
  return null;
end $$;
drop trigger if exists trg_homework_mastery on homework;
create trigger trg_homework_mastery after insert or update on homework
for each row execute function fn_homework_mastery();


-- ---------------------------------------------------------------------------
-- Lesson credits do not expire. If an earlier version of this script was run,
-- these lines remove the expiry machinery and reverse anything it wrote off.
-- ---------------------------------------------------------------------------
drop function if exists expire_credits(uuid);
drop function if exists credit_expiry(uuid);

do $$
begin
  if exists (select 1 from credit_ledger where reason = 'Credits expired') then
    insert into credit_ledger (student_id, delta, reason)
    select student_id, -sum(delta), 'Expiry reversed — credits do not expire'
      from credit_ledger where reason = 'Credits expired'
     group by student_id;
    delete from credit_ledger where reason = 'Credits expired';
  end if;
end $$;

-- ---------------------------------------------------------------------------
-- Actions families are allowed to take, done server-side so the rules cannot
-- be bypassed by calling the table directly.
-- ---------------------------------------------------------------------------
create or replace function request_booking(p_session uuid, p_student uuid) returns text
language plpgsql security definer set search_path = public as $$
declare v_sess sessions; v_class classes; v_taken int; v_enrolled int; v_credits numeric; v_status booking_status;
begin
  if not (is_admin() or p_student in (select my_student_ids())) then
    raise exception 'That is not your student.';
  end if;
  select * into v_sess from sessions where id = p_session;
  if v_sess is null then raise exception 'That slot no longer exists.'; end if;
  if v_sess.status <> 'scheduled' then raise exception 'That lesson has been cancelled.'; end if;
  if (v_sess.session_date + v_sess.start_time) < now() then raise exception 'That slot has already passed.'; end if;

  select * into v_class from classes where id = v_sess.class_id;
  select count(*) into v_enrolled from enrolments where class_id = v_sess.class_id and status = 'active';

  -- a fixed class with a spare seat is bookable as a drop-in even when
  -- is_bookable was never set for it -- that flag still gates ad-hoc slots
  if v_class.kind = 'fixed' then
    if exists (select 1 from enrolments where student_id = p_student and class_id = v_sess.class_id and status = 'active') then
      raise exception 'Already enrolled in this class.';
    end if;
    if v_enrolled >= v_class.capacity then raise exception 'That class is full.'; end if;
  elsif not v_sess.is_bookable then
    raise exception 'That slot is not open for booking.';
  end if;

  select credits into v_credits from students where id = p_student;
  if coalesce(v_credits, 0) <= 0 then raise exception 'No lesson credits left — top up first.'; end if;

  select count(*) into v_taken from bookings where session_id = p_session and status = 'confirmed';
  if v_class.kind = 'fixed' then v_taken := v_taken + v_enrolled; end if;

  if setting_int('booking_auto_confirm', 1) = 1 then
    v_status := case when v_taken < v_sess.capacity then 'confirmed'::booking_status else 'waitlisted'::booking_status end;
  else
    v_status := 'requested';
  end if;

  insert into bookings (session_id, student_id, status, booked_by)
  values (p_session, p_student, v_status, auth.uid())
  on conflict (session_id, student_id)
    do update set status = v_status, booked_by = auth.uid()
    where bookings.status = 'cancelled';

  return v_status::text;
end $$;

create or replace function cancel_booking(p_booking uuid) returns void
language plpgsql security definer set search_path = public as $$
declare v_b bookings; v_s sessions; v_hours int;
begin
  select * into v_b from bookings where id = p_booking;
  if v_b is null then raise exception 'Booking not found.'; end if;
  if not (is_admin() or v_b.student_id in (select my_student_ids())) then
    raise exception 'That is not your booking.';
  end if;
  select * into v_s from sessions where id = v_b.session_id;
  v_hours := setting_int('cancel_hours', 24);
  if not is_admin() and (v_s.session_date + v_s.start_time) < now() + (v_hours || ' hours')::interval then
    raise exception 'Too late to cancel online — please call the centre.';
  end if;
  update bookings set status = 'cancelled' where id = p_booking;
end $$;

-- a family flags, ahead of time, that a student will miss a fixed weekly
-- session — fixed classes have no booking to cancel, so this is the only
-- record that notice was given
create or replace function report_absence(p_session uuid, p_student uuid) returns void
language plpgsql security definer set search_path = public as $$
declare v_sess sessions; v_class classes; v_hours int;
begin
  if not (is_admin() or p_student in (select my_student_ids())) then
    raise exception 'That is not your student.';
  end if;
  select * into v_sess from sessions where id = p_session;
  if v_sess is null then raise exception 'That lesson no longer exists.'; end if;
  if v_sess.status <> 'scheduled' then raise exception 'That lesson has been cancelled.'; end if;

  select * into v_class from classes where id = v_sess.class_id;
  if v_class.kind <> 'fixed' then
    raise exception 'This is a bookable slot — cancel the booking instead.';
  end if;
  if not exists (select 1 from enrolments where student_id = p_student and class_id = v_sess.class_id and status = 'active') then
    raise exception 'Not enrolled in this class.';
  end if;

  v_hours := setting_int('cancel_hours', 24);
  if not is_admin() and (v_sess.session_date + v_sess.start_time) < now() + (v_hours || ' hours')::interval then
    raise exception 'Too late to report online — please call the centre.';
  end if;

  insert into absence_reports (session_id, student_id, reported_by)
  values (p_session, p_student, auth.uid())
  on conflict (session_id, student_id) do nothing;
end $$;

-- redeem a reported absence for a seat in an open bookable slot — this is
-- request_booking() plus the link back to the report, so the family and the
-- centre can both see it was made up
create or replace function redeem_makeup(p_report uuid, p_session uuid) returns text
language plpgsql security definer set search_path = public as $$
declare v_rep absence_reports; v_status text; v_booking uuid;
begin
  select * into v_rep from absence_reports where id = p_report;
  if v_rep is null then raise exception 'Absence report not found.'; end if;
  if not (is_admin() or v_rep.student_id in (select my_student_ids())) then
    raise exception 'That is not your absence report.';
  end if;
  if v_rep.redeemed_booking_id is not null then
    raise exception 'This makeup has already been used.';
  end if;

  v_status := request_booking(p_session, v_rep.student_id);

  select id into v_booking from bookings where session_id = p_session and student_id = v_rep.student_id;
  update absence_reports set redeemed_booking_id = v_booking where id = p_report;

  return v_status;
end $$;

create or replace function submit_homework(p_id uuid) returns void
language plpgsql security definer set search_path = public as $$
begin
  if not (is_admin() or exists (select 1 from homework where id = p_id and student_id in (select my_student_ids()))) then
    raise exception 'That is not your homework.';
  end if;
  update homework set status = 'submitted', submitted_at = now()
   where id = p_id and status = 'assigned';
end $$;

-- generate sessions from the fixed weekly timetable, for a date range
create or replace function generate_sessions(p_from date, p_to date) returns int
language plpgsql security definer set search_path = public as $$
declare c record; d date; n int := 0;
begin
  if not is_admin() then raise exception 'Admins only.'; end if;
  for c in select * from classes where is_active and kind = 'fixed' and day_of_week is not null loop
    d := p_from;
    while d <= p_to loop
      if extract(dow from d)::int = c.day_of_week then
        insert into sessions (class_id, session_date, start_time, end_time, capacity, tutor_name, room)
        values (c.id, d, c.start_time, c.end_time, c.capacity, c.tutor_name, c.room)
        on conflict (class_id, session_date, start_time) do nothing;
        if found then n := n + 1; end if;
      end if;
      d := d + 1;
    end loop;
  end loop;
  return n;
end $$;

-- ===========================================================================
-- PART 2 — Tutors, and test results
-- Added after the first release. Safe to run on an existing database.
-- ===========================================================================

-- 'tutor' is compared as text everywhere below, never as an enum literal, so
-- this can be added and used inside the same script run.
alter type user_role add value if not exists 'tutor';

create or replace function is_tutor() returns boolean
language sql stable security definer set search_path = public as $$
  select exists (select 1 from profiles where id = auth.uid() and role::text = 'tutor');
$$;

create or replace function is_staff() returns boolean
language sql stable security definer set search_path = public as $$
  select exists (select 1 from profiles
                  where id = auth.uid() and role::text in ('admin','tutor'));
$$;

-- ===========================================================================
-- PART 3 — Tutor sign-up, pending admin approval
-- Added after the first release. Safe to run on an existing database.
--
-- A tutor can now sign up themselves, but lands as 'pending_tutor', not
-- 'tutor' -- is_tutor()/is_staff() above only match the literal 'tutor', so
-- a pending account is invisible to every student, schedule and homework
-- policy until an admin promotes it from the Accounts page. Unlike 'tutor',
-- this value IS assigned as an enum literal below, but only inside
-- fn_new_user()'s function body, which only runs on a future sign-up in its
-- own later transaction -- well after this ADD VALUE has committed -- so it
-- is safe to add and use in the same script run.
-- ===========================================================================
alter type user_role add value if not exists 'pending_tutor';

create or replace function fn_new_user() returns trigger
language plpgsql security definer set search_path = public as $$
begin
  insert into profiles (id, role, full_name, email, phone)
  values (
    new.id,
    -- never trust sign-up metadata for privilege: admins are promoted by
    -- hand, and a tutor sign-up lands pending until one approves it
    case when new.raw_user_meta_data->>'role' = 'student' then 'student'::user_role
         when new.raw_user_meta_data->>'role' = 'tutor' then 'pending_tutor'::user_role
         else 'parent'::user_role end,
    coalesce(new.raw_user_meta_data->>'full_name',''),
    new.email,
    new.raw_user_meta_data->>'phone'
  )
  on conflict (id) do nothing;
  return new;
end $$;

-- ===========================================================================
-- PART 4 — Self-service email and phone changes
-- Added after the first release. Safe to run on an existing database.
--
-- Changing email or phone through Supabase Auth (updateUser) only takes
-- effect once confirmed -- a link for email, a texted code for phone -- so
-- profiles is never written to directly from the client for either. This
-- trigger is the only thing that ever updates profiles.email/phone/
-- phone_verified, firing after auth.users actually changes.
-- ===========================================================================
alter table profiles add column if not exists phone_verified boolean not null default false;

create or replace function fn_user_contact_sync() returns trigger
language plpgsql security definer set search_path = public as $$
begin
  update profiles
     set email = coalesce(new.email, email),
         phone = coalesce(new.phone, phone),
         phone_verified = (new.phone_confirmed_at is not null)
   where id = new.id
     and (new.email is distinct from old.email
          or new.phone is distinct from old.phone
          or new.phone_confirmed_at is distinct from old.phone_confirmed_at);
  return new;
end $$;
drop trigger if exists trg_user_contact_sync on auth.users;
create trigger trg_user_contact_sync after update on auth.users
for each row execute function fn_user_contact_sync();

-- The students a tutor actually teaches: enrolled in one of their classes, or
-- booked into one of their sessions.
create or replace function my_taught_student_ids() returns setof uuid
language sql stable security definer set search_path = public as $$
  select e.student_id from enrolments e
    join classes c on c.id = e.class_id
   where c.tutor_id = auth.uid() and e.status = 'active'

  select b.student_id from bookings b
    join sessions se on se.id = b.session_id
    join classes c2 on c2.id = se.class_id

$$;

-- percentage, as a plain expression so it is always consistent
create or replace function pct_of(p_score numeric, p_max numeric) returns numeric
language sql immutable as $$
  select case when coalesce(p_max,0) = 0 then null
              else round((p_score / p_max) * 100, 1) end;
$$;

-- which band a percentage falls into, on a given scale
create or replace function band_for(p_scale uuid, p_pct numeric)
returns grade_bands language sql stable as $$
  select b.* from grade_bands b
   where b.scale_id = p_scale and p_pct >= b.min_pct
   order by b.min_pct desc
   limit 1;
$$;

-- Nobody but staff may set the fields that decide the payout.
create or replace function fn_assessment_guard() returns trigger
language plpgsql security definer set search_path = public as $$
begin
  if tg_op = 'INSERT' then
    new.submitted_by := auth.uid();
    if not is_staff() then
      if not (new.student_id in (select my_student_ids())) then
        raise exception 'That is not your student.';
      end if;
      new.kind := 'school';                 -- families report school results only
      new.status := 'pending';
      new.approved_by := null;
      new.approved_at := null;
    end if;
    new.points_awarded := 0;
    new.band_points := 0;
    new.bonus_points := 0;
  elsif not is_staff() then
    raise exception 'Only the centre can change a result once it is submitted.';
  end if;

  if new.kind = 'school' and new.status = 'approved' and coalesce(new.slip_path,'') = '' then
    raise exception 'A photo of the report slip is needed before this can be approved.';
  end if;
  return new;
end $$;
drop trigger if exists trg_assessment_guard on assessments;
create trigger trg_assessment_guard before insert or update on assessments
for each row execute function fn_assessment_guard();

-- Points land on approval and are taken back if the result is later rejected.
create or replace function fn_assessment_points() returns trigger
language plpgsql security definer set search_path = public as $$
declare
  v_pct   numeric;
  v_band  grade_bands;
  v_prev  assessments;
  v_pband grade_bands;
  v_gain  int := 0;
  v_bonus int := 0;
  v_total int;
begin
  if new.status = 'approved' and coalesce(old.status,'pending') <> 'approved' then
    v_pct := pct_of(new.score, new.max_score);
    if v_pct is null or new.scale_id is null then return new; end if;

    v_band := band_for(new.scale_id, v_pct);
    if v_band is null then return new; end if;

    -- the previous approved result in the SAME SUBJECT is what improvement is measured against
    select * into v_prev from assessments a
     where a.student_id = new.student_id
       and a.subject_id is not distinct from new.subject_id
       and a.status = 'approved'
       and a.id <> new.id
       and (a.taken_on < new.taken_on or (a.taken_on = new.taken_on and a.created_at < new.created_at))
     order by a.taken_on desc, a.created_at desc
     limit 1;

    if v_prev.id is not null and v_prev.scale_id is not null then
      v_pband := band_for(v_prev.scale_id, pct_of(v_prev.score, v_prev.max_score));
      if v_pband is not null then
        v_gain := v_pband.sort_order - v_band.sort_order;     -- positive means improved
        if v_gain > 0 then v_bonus := v_gain * setting_int('points_per_band_improved', 15); end if;
      end if;
    end if;

    v_total := v_band.points + v_bonus;
    new.grade_label    := v_band.label;
    new.band_points    := v_band.points;
    new.bonus_points   := v_bonus;
    new.points_awarded := v_total;
    new.approved_at    := now();

    if v_total <> 0 then
      insert into points_ledger (student_id, delta, reason, ref_table, ref_id)
      values (new.student_id, v_total,
              'Test result ' || v_band.label ||
              case when v_bonus > 0 then ' (up ' || v_gain || ' grade' ||
                   case when v_gain = 1 then '' else 's' end || ')' else '' end,
              'assessments', new.id);
    end if;

  elsif old.status = 'approved' and new.status <> 'approved' and old.points_awarded <> 0 then
    insert into points_ledger (student_id, delta, reason, ref_table, ref_id)
    values (new.student_id, -old.points_awarded, 'Test result withdrawn', 'assessments', new.id);
    new.points_awarded := 0;
    new.band_points := 0;
    new.bonus_points := 0;
  end if;
  return new;
end $$;
drop trigger if exists trg_assessment_points on assessments;
create trigger trg_assessment_points before update on assessments
for each row execute function fn_assessment_points();

-- Topic scores now draw on graded homework AND approved centre tests.
create or replace function recompute_mastery(p_student uuid, p_topic uuid) returns void
language plpgsql security definer set search_path = public as $$
declare v_avg numeric(5,1); v_n int;
begin
  select round(avg(pct)::numeric, 1), count(*) into v_avg, v_n
  from (
    select pct_of(score, max_score) as pct, coalesce(graded_at, now()) as at
      from homework
     where student_id = p_student and topic_id = p_topic
       and status = 'graded' and score is not null
    union all
    select pct_of(score, max_score) as pct, coalesce(approved_at, now()) as at
      from assessments
     where student_id = p_student and topic_id = p_topic
       and kind = 'centre' and status = 'approved' and score is not null
    order by at desc
    limit 8
  ) t;

  if v_n is null or v_n = 0 then
    delete from topic_mastery where student_id = p_student and topic_id = p_topic and manual_score is null;
    return;
  end if;

  insert into topic_mastery (student_id, topic_id, score, samples, updated_at)
  values (p_student, p_topic, least(v_avg, 100), v_n, now())
  on conflict (student_id, topic_id)
  do update set score = excluded.score, samples = excluded.samples, updated_at = now();
end $$;

create or replace function fn_assessment_mastery() returns trigger
language plpgsql security definer set search_path = public as $$
begin
  if new.topic_id is not null then perform recompute_mastery(new.student_id, new.topic_id); end if;
  return null;
end $$;
drop trigger if exists trg_assessment_mastery on assessments;
create trigger trg_assessment_mastery after insert or update on assessments
for each row execute function fn_assessment_mastery();

-- one call for the admin queue
create or replace function decide_assessment(p_id uuid, p_approve boolean, p_note text default null)
returns void language plpgsql security definer set search_path = public as $$
begin
  if not is_admin() then raise exception 'Only an administrator can approve a result.'; end if;
  update assessments
     set status = case when p_approve then 'approved' else 'rejected' end,
         approved_by = auth.uid(),
         notes = coalesce(p_note, notes)
   where id = p_id;
end $$;

-- PART 5 — Lesson reports: topics covered, proficiency grading, a summary
-- Added after the first release. Safe to run on an existing database.
--
-- After taking the register, a tutor can grade each attending student's
-- proficiency on whichever topics the lesson covered. Each grade is one more
-- data point recompute_mastery() averages over the last 8, exactly like a
-- piece of graded homework or an approved centre test -- not an override,
-- so a trend builds up lesson by lesson rather than one score getting
-- silently replaced.
-- ===========================================================================
alter table sessions add column if not exists lesson_summary text;

create table if not exists lesson_topic_grades (
  id          uuid primary key default gen_random_uuid(),
  session_id  uuid not null references sessions(id) on delete cascade,
  student_id  uuid not null references students(id) on delete cascade,
  topic_id    uuid not null references topics(id) on delete cascade,
  score       numeric(5,1) not null check (score between 0 and 100),
  graded_by   uuid references profiles(id) on delete set null,
  created_at  timestamptz not null default now(),
  updated_at  timestamptz not null default now(),
  unique (session_id, student_id, topic_id)
);
create index if not exists lesson_topic_grades_student_idx on lesson_topic_grades(student_id, topic_id);

create or replace function recompute_mastery(p_student uuid, p_topic uuid) returns void
language plpgsql security definer set search_path = public as $$
declare v_avg numeric(5,1); v_n int;
begin
  select round(avg(pct)::numeric, 1), count(*) into v_avg, v_n
  from (
    select pct_of(score, max_score) as pct, coalesce(graded_at, now()) as at
      from homework
     where student_id = p_student and topic_id = p_topic
       and status = 'graded' and score is not null
    union all
    select pct_of(score, max_score) as pct, coalesce(approved_at, now()) as at
      from assessments
     where student_id = p_student and topic_id = p_topic
       and kind = 'centre' and status = 'approved' and score is not null
    union all
    select score as pct, coalesce(updated_at, created_at) as at
      from lesson_topic_grades
     where student_id = p_student and topic_id = p_topic
    order by at desc
    limit 8
  ) t;

  if v_n is null or v_n = 0 then
    delete from topic_mastery where student_id = p_student and topic_id = p_topic and manual_score is null;
    return;
  end if;

  insert into topic_mastery (student_id, topic_id, score, samples, updated_at)
  values (p_student, p_topic, least(v_avg, 100), v_n, now())
  on conflict (student_id, topic_id)
  do update set score = excluded.score, samples = excluded.samples, updated_at = now();
end $$;

-- how many tutors (or admins, since an admin can be a class's tutor too)
-- could cover each hour of each day in the range — one call for a whole
-- week's calendar, rather than one round trip per cell
create or replace function tutor_availability_grid(p_from date, p_to date, p_start_hour int default 9, p_end_hour int default 21)
returns table(slot_date date, slot_hour int, tutors_free int)
language plpgsql stable security definer set search_path = public as $$
declare d date; h int; hstart time; hend time; n int;
begin
  d := p_from;
  while d <= p_to loop
    h := p_start_hour;
    while h < p_end_hour loop
      hstart := make_time(h, 0, 0);
      hend := make_time(h + 1, 0, 0);
      select count(*) into n from profiles p
       where p.role::text in ('tutor', 'admin')
         and exists (
           select 1 from tutor_availability a
            where a.tutor_id = p.id and a.day_of_week = extract(dow from d)::int
              and a.start_time <= hstart and a.end_time >= hend)
         and not exists (
           select 1 from tutor_time_off o
            where o.tutor_id = p.id and o.off_date = d
              and (o.start_time is null or (o.start_time < hend and o.end_time > hstart)))
         and not exists (
           select 1 from sessions se join classes c on c.id = se.class_id
            where coalesce(se.tutor_id, c.tutor_id) = p.id
              and se.session_date = d and se.status = 'scheduled'
              and se.start_time < hend and se.end_time > hstart);
      slot_date := d; slot_hour := h; tutors_free := n;
      return next;
      h := h + 1;
    end loop;
    d := d + 1;
  end loop;
end $$;

-- ===========================================================================
-- PART 8 — Levels and streams as real reference data, not free text
-- Added after the first release. Safe to run on an existing database.
--
-- "Level" (Sec 3, P5, JC1 …) and "stream" (G1, G2, G3 …) used to be a
-- free-text field typed the same way on classes, students and topics —
-- "Sec 3 G3" one place, "sec3 g3" another, and an exact-string comparison
-- silently failing was how a spare seat in a same-subject class stopped
-- being offered as a drop-in. Centres differ on both lists (a primary
-- centre has no JC levels; streams are a centre's own naming), so admins
-- define both here rather than the app hard-coding either. The old
-- "level" text columns are left in place, unused, rather than dropped —
-- nothing currently reads them once the app is updated to the *_id
-- columns below.
-- ===========================================================================

-- request_booking() now also checks, server-side, that a fixed-class
-- drop-in is the same subject and stream the student already takes
-- elsewhere — matching what bookableView offers, so the rule can't be
-- skipped by calling the RPC directly with an arbitrary session id.
create or replace function request_booking(p_session uuid, p_student uuid) returns text
language plpgsql security definer set search_path = public as $$
declare v_sess sessions; v_class classes; v_taken int; v_enrolled int; v_credits numeric; v_status booking_status;
begin
  if not (is_admin() or p_student in (select my_student_ids())) then
    raise exception 'That is not your student.';
  end if;
  select * into v_sess from sessions where id = p_session;
  if v_sess is null then raise exception 'That slot no longer exists.'; end if;
  if v_sess.status <> 'scheduled' then raise exception 'That lesson has been cancelled.'; end if;
  if (v_sess.session_date + v_sess.start_time) < now() then raise exception 'That slot has already passed.'; end if;

  select * into v_class from classes where id = v_sess.class_id;
  select count(*) into v_enrolled from enrolments where class_id = v_sess.class_id and status = 'active';

  -- a fixed class with a spare seat is bookable as a drop-in even when
  -- is_bookable was never set for it -- that flag still gates ad-hoc slots
  if v_class.kind = 'fixed' then
    if exists (select 1 from enrolments where student_id = p_student and class_id = v_sess.class_id and status = 'active') then
      raise exception 'Already enrolled in this class.';
    end if;
    if v_enrolled >= v_class.capacity then raise exception 'That class is full.'; end if;
    if not exists (
      select 1 from enrolments e join classes c on c.id = e.class_id
       where e.student_id = p_student and e.status = 'active'
         and c.subject_id = v_class.subject_id and c.stream_id is not distinct from v_class.stream_id
    ) then
      raise exception 'This student does not already take this subject and stream elsewhere.';
    end if;
  elsif not v_sess.is_bookable then
    raise exception 'That slot is not open for booking.';
  end if;

  select credits into v_credits from students where id = p_student;
  if coalesce(v_credits, 0) <= 0 then raise exception 'No lesson credits left — top up first.'; end if;

  select count(*) into v_taken from bookings where session_id = p_session and status = 'confirmed';
  if v_class.kind = 'fixed' then v_taken := v_taken + v_enrolled; end if;

  if setting_int('booking_auto_confirm', 1) = 1 then
    v_status := case when v_taken < v_sess.capacity then 'confirmed'::booking_status else 'waitlisted'::booking_status end;
  else
    v_status := 'requested';
  end if;

  insert into bookings (session_id, student_id, status, booked_by)
  values (p_session, p_student, v_status, auth.uid())
  on conflict (session_id, student_id)
    do update set status = v_status, booked_by = auth.uid()
    where bookings.status = 'cancelled';

  return v_status::text;
end $$;

-- Added after the first release. Safe to run on an existing database.
--
-- A subject alone doesn't determine which topics apply — "Additional Math
-- Sec 3" and "Additional Math Sec 4" cover different chapters, and this
-- centre's streams carry different content too, not just a different
-- pace. topics.level_id already existed; stream_id was missing. Both are

-- stream"), so a topic can be as broad or as specific as it needs to be.

alter table topics add column if not exists stream_id uuid references streams(id) on delete set null;
`;

const HITPAY_SALT = Deno.env.get("HITPAY_SALT") || "";
const SITE_URL    = Deno.env.get("SITE_URL") || "";
