// ---------------------------------------------------------------------------
// 1. Create a checkout link for one invoice
// ---------------------------------------------------------------------------
async function createCheckout(req) {
  const authHeader = req.headers.get("Authorization") || "";
  if (!authHeader) return json({ error: "Sign in first." }, 401);

  const asUser = createClient(SB_URL, Deno.env.get("SUPABASE_ANON_KEY"), {
    global: { headers: { Authorization: authHeader } },
    auth: { persistSession: false },
  });
  const userRes = await asUser.auth.getUser();
  const user = userRes.data && userRes.data.user;
  if (!user) return json({ error: "Sign in first." }, 401);

  const body = await req.json().catch(function () { return {}; });
  const invoiceId = body.invoice_id;
  if (!invoiceId) return json({ error: "No invoice given." }, 400);

  // RLS on this read is what proves the caller is allowed to pay this invoice
  const inv = await asUser.from("invoices").select("*").eq("id", invoiceId).single();
  if (inv.error || !inv.data) return json({ error: "Invoice not found." }, 404);
  if (inv.data.status === "paid") return json({ error: "This invoice is already paid." }, 409);
  if (inv.data.status === "void") return json({ error: "This invoice was cancelled." }, 409);

  const prof = await asUser.from("profiles").select("full_name,email,phone").eq("id", user.id).single();
  const amount = (inv.data.amount_cents / 100).toFixed(2);

  const form = new URLSearchParams();
  form.set("amount", amount);
  form.set("currency", "SGD");
  form.set("email", (prof.data && prof.data.email) || user.email || "");
  form.set("name", (prof.data && prof.data.full_name) || "");
  form.set("purpose", inv.data.description || ("Lesson package " + inv.data.invoice_no));
  form.set("reference_number", inv.data.invoice_no);
  form.set("redirect_url", SITE_URL + "?paid=" + inv.data.invoice_no);
  form.set("webhook", SB_URL + "/functions/v1/hitpay/webhook");
  form.set("send_email", "true");

  const res = await fetch(HITPAY_BASE + "/payment-requests", {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded",
      "X-BUSINESS-API-KEY": HITPAY_KEY,
      "X-Requested-With": "XMLHttpRequest",
    },
    body: form.toString(),
  });

  const data = await res.json().catch(function () { return null; });
  if (!res.ok || !data || !data.url) {
    return json({ error: "HitPay refused the request.", detail: data }, 502);
  }

  await admin().from("invoices").update({
    hitpay_request_id: data.id,
    hitpay_url: data.url,
    status: inv.data.status === "draft" ? "sent" : inv.data.status,
  }).eq("id", invoiceId);

  return json({ url: data.url, id: data.id });
}

// ---------------------------------------------------------------------------
// 2. Webhook — HitPay tells us the money arrived
// ---------------------------------------------------------------------------
async function hmacHex(secret, message) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey(
    "raw", enc.encode(secret), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]
  );
  const sig = await crypto.subtle.sign("HMAC", key, enc.encode(message));
  return Array.from(new Uint8Array(sig))
    .map(function (b) { return b.toString(16).padStart(2, "0"); })
    .join("");
}

async function webhook(req) {
  const raw = await req.text();
  const params = new URLSearchParams(raw);

  const fields = {};
  params.forEach(function (v, k) { if (k !== "hmac") fields[k] = v; });
  const given = params.get("hmac") || "";

  // HitPay's signature: keys sorted, key and value concatenated with no separators
  const message = Object.keys(fields).sort().map(function (k) { return k + fields[k]; }).join("");
  const mine = await hmacHex(HITPAY_SALT, message);

  if (!given || given.length !== mine.length) return json({ error: "Bad signature." }, 401);
  let same = 0;
  for (let i = 0; i < mine.length; i++) same |= mine.charCodeAt(i) ^ given.charCodeAt(i);
  if (same !== 0) return json({ error: "Bad signature." }, 401);

  if (fields.status !== "completed") return json({ ok: true, ignored: fields.status });

  const db = admin();
  const ref = fields.reference_number;
  const q = await db.from("invoices").select("id,status,amount_cents").eq("invoice_no", ref).single();
  if (q.error || !q.data) return json({ error: "Unknown invoice." }, 404);
  if (q.data.status === "paid") return json({ ok: true, already: true });

  // never trust the posted amount blindly — it must match what we billed
  const paidCents = Math.round(parseFloat(fields.amount || "0") * 100);
  if (paidCents !== q.data.amount_cents) {
    return json({ error: "Amount does not match the invoice." }, 409);
  }

  // the invoice trigger tops up the student's lesson credits
  const upd = await db.from("invoices").update({
    status: "paid",
    paid_at: new Date().toISOString(),
    payment_ref: fields.payment_id || fields.payment_request_id || null,
  }).eq("id", q.data.id);

  if (upd.error) return json({ error: upd.error.message }, 500);
  return json({ ok: true });
}

// ---------------------------------------------------------------------------
Deno.serve(async function (req) {
  if (req.method === "OPTIONS") return new Response("ok", { headers: CORS });
  try {
    if (new URL(req.url).pathname.endsWith("/webhook")) return await webhook(req);
    if (req.method !== "POST") return json({ error: "POST only." }, 405);
    return await createCheckout(req);
  } catch (e) {
    return json({ error: String(e && e.message ? e.message : e) }, 500);
  }
});
`;

function creditStrip(credits, capacity) {
  const c = Math.max(0, Math.round(Number(credits || 0)));
  const cap = Math.max(capacity || 10, Math.min(c, 20));
  let out = '<div class="credit-strip" aria-hidden="true">';
  for (let i = 0; i < Math.min(cap, 20); i++) {
    const cls = i < c ? (c <= 2 ? "low" : "") : "spent";
    out += "<i" + (cls ? ' class="' + cls + '"' : "") + "></i>";
  }
  out += "</div>";
  if (c === 0) out = '<div class="credit-strip" aria-hidden="true"><i class="none"></i><i class="none"></i><i class="none"></i></div>';
  return out;
}

    state.settings = o;
  } catch (e) { state.settings = {}; }
}

/* ------------------------------------------------------------------- auth -- */
async function loadMe() {
  const { data } = await db.auth.getUser();
  state.user = data ? data.user : null;
  if (!state.user) return;

  let prof = null;
  for (let attempt = 0; attempt < 3 && !prof; attempt++) {
    const r = await db.from("profiles").select("*").eq("id", state.user.id).maybeSingle();
    prof = r.data;
    if (!prof) await new Promise(res => setTimeout(res, 500));   // signup trigger may still be running
  }
  state.profile = prof;
  state.role = prof ? prof.role : null;

  if (state.role === "parent") {
    state.students = await sel("students", q => q.eq("parent_id", state.user.id).order("full_name"));
  } else if (state.role === "student") {
    state.students = await sel("students", q => q.eq("profile_id", state.user.id));
  } else {
    state.students = [];               // admin and tutor work across the whole roll
  }
  state.activeStudent = state.students.length ? state.students[0].id : null;
  await loadSettings();
}

async function signIn(email, password) {
  const { error } = await db.auth.signInWithPassword({ email, password });
  if (error) throw error;
}
async function signUp(email, password, fullName, phone, role) {
  const { data, error } = await db.auth.signUp({
    email, password,
    options: { data: { full_name: fullName, phone: phone, role: role } },
  });
  if (error) throw error;
  // no session back means email confirmation is switched on and pending —
  // there's nothing to sign the person into yet
  return !!(data && data.session);
}
async function signOut() {
  await db.auth.signOut();
  state.user = null; state.profile = null; state.role = null;
  location.hash = "";
  render();
}

async function refreshBadges() {
  try {
    const b = await db.from("bookings").select("id", { count: "exact", head: true }).eq("status", "requested");
    const l = await db.from("lesson_requests").select("id", { count: "exact", head: true }).eq("status", "pending");
    const r = await db.from("redemptions").select("id", { count: "exact", head: true }).eq("status", "pending");
    const a = await db.from("assessments").select("id", { count: "exact", head: true }).eq("status", "pending");
    const p = await db.from("profiles").select("id", { count: "exact", head: true }).eq("role", "pending_tutor");
    const next = { bookings: (b.count || 0) + (l.count || 0), redemptions: r.count || 0, assessments: a.count || 0, pendingTutors: p.count || 0 };
    if (next.bookings !== state.counts.bookings || next.redemptions !== state.counts.redemptions
        || next.assessments !== state.counts.assessments || next.pendingTutors !== state.counts.pendingTutors) {
      state.counts = next;
      $$(".nav-item").forEach(el => {
        const item = (NAV.admin.find(n => n.r === el.dataset.route) || {});
        const old = $(".badge-n", el);
        if (old) old.remove();
        if (item.count && next[item.count]) {
          const s = document.createElement("span");
          s.className = "badge-n";
          s.textContent = next[item.count];
          el.appendChild(s);
        }
      });
    }
  } catch (e) { /* badges are cosmetic */ }
}

/* ------------------------------------------------------------- SCHEDULE ---- */
ADMIN.schedule = async function (view) {
  const from = state.weekStart, to = addDays(from, 6);
  const [sessions, classes, bookings, levels] = await Promise.all([
    sel("sessions", q => q.gte("session_date", from).lte("session_date", to).order("start_time")),
    sel("classes", q => q.order("name")),
    sel("bookings", q => q.in("status", ["confirmed", "requested"])),
    sel("levels"),
  ]);
  const cmap = byId(classes), lvMap = byId(levels);
  const counts = {};
  bookings.forEach(b => (counts[b.session_id] = (counts[b.session_id] || 0) + (b.status === "confirmed" ? 1 : 0)));

  const cols = [];
  for (let i = 0; i < 7; i++) {
    const d = addDays(from, i);
    const day = sessions.filter(s => s.session_date === d);
    const items = day.map(s => {
      const c = cmap[s.class_id] || {};
      const lv = lvMap[c.level_id];
      return '<div class="sess' + (s.is_bookable ? " adhoc" : "") + (s.status === "cancelled" ? " cancelled" : "") +
        '" data-act="session-detail" data-id="' + s.id + '" tabindex="0">' +
        '<div class="t">' + esc(fmtRange(s.start_time, s.end_time)) + "</div>" +
        '<div class="n">' + esc(c.name || "Class") + "</div>" +
        '<div class="m">' + (lv ? esc(lv.name) + " · " : "") + (counts[s.id] || 0) + "/" + s.capacity + "</div></div>";
    }).join("");
    cols.push('<div class="week-col' + (d === today() ? " today" : "") + '">' +
      '<div class="dh">' + DOW3[i] + " <b>" + fmtDateShort(d) + "</b></div>" + items + "</div>");
  }

  view.innerHTML =
    pageHead("Schedule", fmtDate(from) + " – " + fmtDate(to),
      '<div class="btn-row">' +
        '<button class="btn btn-ghost" data-act="week" data-d="-7">‹ Previous</button>' +
        '<button class="btn btn-ghost" data-act="week" data-d="0">This week</button>' +
        '<button class="btn btn-ghost" data-act="week" data-d="7">Next ›</button>' +
        '<button class="btn btn-mint" data-act="generate-sessions">Generate from timetable</button>' +
        '<button class="btn btn-primary" data-act="new-session">Add a slot</button>' +
      "</div>") +
    '<div class="tbl-wrap"><div class="week-grid">' + cols.join("") + "</div></div>" +
    '<div class="legend" style="margin-top:12px">' +
      '<span><i style="background:#2EC4B6"></i>Timetabled class</span>' +
      '<span><i style="background:#F2664B"></i>Open slot families can book</span>' +
      '<span><i style="background:#C0392B"></i>Cancelled</span>' +
    "</div>";
};

  if (!s) return;
  const c = (await sel("classes", q => q.eq("id", s.class_id)))[0] || {};
  const cLevel = c.level_id ? (await sel("levels", q => q.eq("id", c.level_id)))[0] : null;
  const [bookings, enrols, students, att] = await Promise.all([
    sel("bookings", q => q.eq("session_id", id)),
    sel("enrolments", q => q.eq("class_id", s.class_id).eq("status", "active")),
    sel("students", q => q.eq("is_active", true)),
    sel("attendance", q => q.eq("session_id", id)),
  ]);
  const smap = byId(students);
  const amap = {}; att.forEach(a => (amap[a.student_id] = a));

  const ids = new Set();
  enrols.forEach(e => ids.add(e.student_id));

  openModal({
    title: (c.name || "Session") + " · " + fmtDate(s.session_date),
    wide: true,
    body:
      '<div class="row" style="margin-bottom:14px">' +
        '<span class="pill ink">' + esc(fmtRange(s.start_time, s.end_time)) + "</span>" +
        '<span class="pill">' + esc(cLevel ? cLevel.name : "—") + "</span>" +
        '<span class="pill">' + esc(s.tutor_name || c.tutor_name || "Tutor TBC") + "</span>" +
        '<span class="pill">' + esc(s.room || c.room || "Room TBC") + "</span>" +
        (s.is_bookable ? '<span class="pill hl">Open slot</span>' : "") +
        (s.status === "cancelled" ? '<span class="pill bad">Cancelled</span>' : "") +
      "</div>" +

      (roster ? table(["Student", "Attendance"], [roster]) : emptyState("☺", "Nobody yet", "Enrol students in the class, or let families book this slot.")) +
      (pending.length ? "<h4 style='margin:16px 0 8px'>Requests waiting</h4>" +
        table(["Student", ""], pending.map(b =>
          "<tr><td>" + esc(nameOf(smap, b.student_id)) + '</td><td class="act">' +
          '<button class="btn btn-sm btn-mint" data-act="booking-set" data-id="' + b.id + '" data-v="confirmed">Confirm</button> ' +

function addMinutesToTime(t, mins) {
  const [h, m] = t.slice(0, 5).split(":").map(Number);
  const total = ((h * 60 + m + mins) % 1440 + 1440) % 1440;
  return String(Math.floor(total / 60)).padStart(2, "0") + ":" + String(total % 60).padStart(2, "0");
}

/* Accepting a custom lesson request creates the actual session, confirms a
   booking for the requesting student, and closes out the request — all in
   one save, since none of it exists yet. */
async function scheduleLessonRequest(requestId) {
  const r = (await sel("lesson_requests", q => q.eq("id", requestId)))[0];
  if (!r) return toast("That request no longer exists.", "bad");
  const [student, subject, classes, tutors, levels] = await Promise.all([
    sel("students", q => q.eq("id", r.student_id)).then(x => x[0]),
    r.subject_id ? sel("subjects", q => q.eq("id", r.subject_id)).then(x => x[0]) : null,
    sel("classes", q => q.eq("is_active", true).order("name")),
    sel("profiles", q => q.in("role", ["tutor", "admin"]).order("full_name")),
    sel("levels"),
  ]);
  const lvMap = byId(levels);
  const opts = classes.slice().sort((a, b) => (b.subject_id === r.subject_id) - (a.subject_id === r.subject_id))
    .map(c => ({ value: c.id, label: c.name + (c.level_id && lvMap[c.level_id] ? " · " + lvMap[c.level_id].name : "") }));

  openModal({
    title: "Schedule " + (subject ? subject.name : "a lesson") + " for " + (student ? student.full_name : "—"),
    body:
      '<div class="note">Requested ' + esc(fmtDate(r.requested_date)) + " " + esc(fmtTime(r.requested_time)) +
        (r.note ? "<br>" + esc(r.note) : "") + "</div>" +
      fSelect("class_id", "Class", "", opts, { blank: "Choose a class", hint: "Classes in the requested subject are listed first." }) +
      '<div class="grid-3">' +
        fText("session_date", "Date", r.requested_date, { type: "date" }) +
        fText("start_time", "Starts", r.requested_time.slice(0, 5), { type: "time" }) +
        fText("end_time", "Ends", addMinutesToTime(r.requested_time, 90), { type: "time" }) +
      "</div>" +
      '<div class="grid-3">' +
        fText("capacity", "Seats", 8, { type: "number", min: 1 }) +
        fSelect("tutor_id", "Tutor account", "", tutors.map(t => ({ value: t.id, label: t.full_name })), { blank: "—" }) +
        fText("room", "Room", "") +
      "</div>",
    onSave: async () => {
      const v = modalValues();
      if (!v.class_id) return toast("Choose a class first.", "bad");
      try {
        const tutorProfile = tutors.find(t => t.id === v.tutor_id);
        await ins("sessions", {
          class_id: v.class_id, session_date: v.session_date, start_time: v.start_time, end_time: v.end_time,
          capacity: v.capacity, tutor_id: v.tutor_id || null, tutor_name: tutorProfile ? tutorProfile.full_name : null,
          room: v.room, is_bookable: false, status: "scheduled",
        });
        // sessions has no other identifying field back from insert, so look
        // it up by the (class_id, session_date, start_time) unique triple
        const newSession = (await sel("sessions", q =>
          q.eq("class_id", v.class_id).eq("session_date", v.session_date).eq("start_time", v.start_time)))[0];
        if (!newSession) throw new Error("Could not find the newly created session.");
        await ins("bookings", { session_id: newSession.id, student_id: r.student_id, status: "confirmed", booked_by: state.user.id });
        await upd("lesson_requests", r.id, {
          status: "scheduled", session_id: newSession.id, decided_by: state.user.id, decided_at: new Date().toISOString(),
        });
        closeModal(); toast("Lesson scheduled.", "ok"); render();
      } catch (e) { fail(e); }
    },
  });
}

ADMIN.bookings = async function (view) {
  const bookings = await sel("bookings", q => q.order("created_at", { ascending: false }).limit(200));
  const [students, sessions, classes, lessonRequests, subjects] = await Promise.all([
    sel("students"), sel("sessions"), sel("classes"),

    sel("subjects"),
  ]);
  const smap = byId(students), semap = byId(sessions), cmap = byId(classes), subjmap = byId(subjects);

  const grp = { requested: [], confirmed: [], other: [] };
  bookings.forEach(b => (grp[b.status] ? grp[b.status] : grp.other).push(b));
  const pendingRequests = lessonRequests.filter(r => r.status === "pending");
  const decidedRequests = lessonRequests.filter(r => r.status !== "pending");

  const rowFor = (b, withActions) => {
    const s = semap[b.session_id] || {};
    const c = cmap[s.class_id] || {};
    return "<tr><td><b>" + esc(nameOf(smap, b.student_id)) + "</b></td>" +
      "<td>" + esc(c.name || "—") + "<br><span class='pill'>" + esc(fmtDate(s.session_date)) + " " + esc(fmtTime(s.start_time)) + "</span></td>" +
      "<td>" + esc(b.note || "") + "</td>" +
      '<td><span class="pill ' + (b.status === "confirmed" ? "ok" : b.status === "requested" ? "warn" : "") + '">' + esc(b.status) + "</span></td>" +
      '<td class="act">' + (withActions
        ? '<button class="btn btn-sm btn-mint" data-act="booking-set" data-id="' + b.id + '" data-v="confirmed">Confirm</button> ' +
          '<button class="btn btn-sm btn-ghost" data-act="booking-set" data-id="' + b.id + '" data-v="waitlisted">Waitlist</button> ' +
          '<button class="btn btn-sm btn-danger" data-act="booking-set" data-id="' + b.id + '" data-v="rejected">Decline</button>'
        : b.status === "confirmed"
          ? '<button class="btn btn-sm btn-danger" data-act="booking-set" data-id="' + b.id + '" data-v="cancelled">Cancel</button>' : "") +
      "</td></tr>";
  };

  const requestRow = (r, withActions) => {

      "<td>" + esc(subj ? subj.name : "—") + "</td>" +
      "<td>" + esc(fmtDate(r.requested_date)) + " " + esc(fmtTime(r.requested_time)) + "</td>" +
      "<td>" + esc(r.note || "") + "</td>" +
      '<td><span class="pill ' + pill + '">' + esc(r.status) + "</span></td>" +
      '<td class="act">' + (withActions
        ? '<button class="btn btn-sm btn-mint" data-act="lesson-request-accept" data-id="' + r.id + '">Accept & schedule</button> ' +
          '<button class="btn btn-sm btn-danger" data-act="lesson-request-decline" data-id="' + r.id + '">Decline</button>'
        : "") + "</td></tr>";
  };

  view.innerHTML =
    pageHead("Booking requests", "Families asking for a place in an open slot, or proposing a new one") +
    card("Custom lesson requests waiting (" + pendingRequests.length + ")",
      pendingRequests.length ? table(["Student", "Subject", "Requested", "Note", "Status", ""], pendingRequests.map(r => requestRow(r, true)))
                             : emptyState("✓", "Nothing waiting", "Appears when a family proposes a day and time nothing else covers."), "", true) +
    card("Waiting for a decision (" + grp.requested.length + ")",
      grp.requested.length ? table(["Student", "Slot", "Note", "Status", ""], grp.requested.map(b => rowFor(b, true)))
                           : emptyState("✓", "Nothing waiting", "New requests appear here as families make them."), "", true) +
    card("Confirmed", grp.confirmed.length
      ? table(["Student", "Slot", "Note", "Status", ""], grp.confirmed.slice(0, 60).map(b => rowFor(b, false)))
      : emptyState("▦", "No confirmed bookings yet", ""), "", true) +
    (grp.other.length ? card("Declined, cancelled and waitlisted",
      table(["Student", "Slot", "Note", "Status", ""], grp.other.slice(0, 40).map(b => rowFor(b, false))), "", true) : "") +
    (decidedRequests.length ? card("Past lesson requests",
      table(["Student", "Subject", "Requested", "Note", "Status", ""], decidedRequests.slice(0, 30).map(r => requestRow(r, false))), "", true) : "");

async function attendanceSheet(sessionId) {
  const s = (await sel("sessions", q => q.eq("id", sessionId)))[0];
  const c = (await sel("classes", q => q.eq("id", s.class_id)))[0] || {};
  const [enrols, bookings, students, att, reports, subjectTopics, grades] = await Promise.all([
    sel("enrolments", q => q.eq("class_id", s.class_id).eq("status", "active")),
    sel("bookings", q => q.eq("session_id", sessionId).eq("status", "confirmed")),
    sel("students", q => q.eq("is_active", true)),
    sel("attendance", q => q.eq("session_id", sessionId)),
    sel("absence_reports", q => q.eq("session_id", sessionId)),
    c.subject_id ? sel("topics", q => q.eq("subject_id", c.subject_id).order("sort_order")) : [],
    sel("lesson_topic_grades", q => q.eq("session_id", sessionId)),
  ]);
  // a topic with no level/stream set applies everywhere; one that does
  // must match this class's — a subject alone doesn't say which topics
  // are in scope, since the same subject differs by level and stream
  const topics = subjectTopics.filter(t =>
    (!t.level_id || t.level_id === c.level_id) && (!t.stream_id || t.stream_id === c.stream_id));
  const smap = byId(students);
  const amap = {}; att.forEach(a => (amap[a.student_id] = a));
  const rmap = {}; reports.forEach(r => (rmap[r.student_id] = r));
  const gmap = {}; grades.forEach(g => (gmap[g.student_id + "_" + g.topic_id] = g));

  const ids = [];
  enrols.forEach(e => ids.includes(e.student_id) || ids.push(e.student_id));
  bookings.forEach(b => ids.includes(b.student_id) || ids.push(b.student_id));

  if (!ids.length) {
    return openModal({
      title: "Register", body: emptyState("☺", "Nobody is expected", "Enrol students in this class first."),
      foot: '<button class="btn btn-ghost" data-act="modal-close">Close</button>',
    });
  }

  const opts = ["present", "late", "absent", "excused"];
  const rows = ids.map(sid => {
    const st = smap[sid] || {};
    const cur = amap[sid] ? amap[sid].status : "";
    const low = Number(st.credits) <= 0;
    return "<tr><td><b>" + esc(st.full_name) + "</b>" +
      (low ? ' <span class="pill bad">no credits</span>' : ' <span class="pill">' + st.credits + " left</span>") +
      (rmap[sid] ? ' <span class="pill info">absence reported</span>' : "") + "</td>" +
      '<td><select name="att_' + sid + '"><option value="">— not marked —</option>' +
      opts.map(o => '<option value="' + o + '"' + (cur === o ? " selected" : "") + ">" + o[0].toUpperCase() + o.slice(1) + "</option>").join("") +
      "</select></td></tr>";
  });

  // only topics ticked below get a grading column — pre-tick whichever
  // topics this session already has grades saved for
  const initiallyCovered = new Set(topics.filter(t => ids.some(sid => gmap[sid + "_" + t.id])).map(t => t.id));

  const renderTopicGrid = coveredIds => {
    const covered = topics.filter(t => coveredIds.has(t.id));
    if (!covered.length) return "<p class='hint'>Tick a topic above to grade proficiency on it.</p>";
    return table(["Student"].concat(covered.map(t => t.name)),
      ids.map(sid => "<tr><td><b>" + esc((smap[sid] || {}).full_name || "") + "</b></td>" +
        covered.map(t => {
          const g = gmap[sid + "_" + t.id];
          return '<td><input type="number" min="0" max="100" step="0.5" style="width:64px" name="grade_' +
            sid + "_" + t.id + '" value="' + (g ? g.score : "") + '"></td>';
        }).join("") + "</tr>"));
  };

  openModal({
    title: (c.name || "Class") + " · " + fmtDate(s.session_date) + " " + fmtTime(s.start_time),
    wide: true,
    body:
      '<div class="note">Present and Late both use one lesson credit. Absent and Excused do not. Correcting a mark later refunds the credit automatically.</div>' +
      '<div class="btn-row" style="margin-bottom:12px"><button class="btn btn-sm btn-ghost" data-act="att-all" data-v="present">Mark everyone present</button></div>' +
      table(["Student", "Attendance"], rows) +
      (topics.length
        ? "<div class='divider'></div><h4 style='margin-bottom:6px'>Topics covered this lesson</h4>" +
          "<p class='hint' style='margin-bottom:10px'>Pick one or more to grade each student's proficiency on them.</p>" +
          '<div class="btn-row" style="flex-wrap:wrap;margin-bottom:12px">' +
          topics.map(t => '<button type="button" class="kid-tab" aria-selected="' + initiallyCovered.has(t.id) +
            '" data-act="toggle-topic-covered" data-topic="' + t.id + '">' + esc(t.name) + "</button>").join("") +
          "</div>" +
          '<div id="topic-grid-holder">' + renderTopicGrid(initiallyCovered) + "</div>"
        : "") +
      "<div class='divider'></div><h4 style='margin-bottom:10px'>Lesson summary</h4>" +
      fArea("lesson_summary", "What was covered", s.lesson_summary || "") +
      "<div class='divider'></div><h4 style='margin-bottom:10px'>Homework (optional)</h4>" +
      fText("hw_title", "Task", "", { placeholder: "Ex 7.2 Q1–14" }) +
      '<div class="grid-2">' +
        (topics.length ? fSelect("hw_topic_id", "Topic", "", topics.map(t => ({ value: t.id, label: t.name })), { blank: "— no topic —" }) : "") +
        fText("hw_due_at", "Due", addDays(s.session_date, 7), { type: "date" }) +
      "</div>" +
      fArea("hw_instructions", "Instructions", ""),
    onSave: async () => {
      try {
        for (const sid of ids) {
          const v = $('[name="att_' + sid + '"]').value;
          const existing = amap[sid];
          if (!v) { if (existing) await del("attendance", existing.id); continue; }
          if (existing) { if (existing.status !== v) await upd("attendance", existing.id, { status: v, marked_by: state.user.id }); }
          else await ins("attendance", { session_id: sessionId, student_id: sid, status: v, marked_by: state.user.id });
        }

        const coveredNow = new Set($$('[data-act="toggle-topic-covered"][aria-selected="true"]').map(el => el.dataset.topic));
        for (const sid of ids) {
          for (const t of topics) {
            const existing = gmap[sid + "_" + t.id];
            if (!coveredNow.has(t.id)) { if (existing) await del("lesson_topic_grades", existing.id); continue; }
            const el = $('[name="grade_' + sid + '_' + t.id + '"]');
            if (!el) continue;
            const val = el.value.trim();
            if (val === "") { if (existing) await del("lesson_topic_grades", existing.id); continue; }
            const num = Number(val);
            if (existing) { if (Number(existing.score) !== num) await upd("lesson_topic_grades", existing.id, { score: num, graded_by: state.user.id, updated_at: new Date().toISOString() }); }
            else await ins("lesson_topic_grades", { session_id: sessionId, student_id: sid, topic_id: t.id, score: num, graded_by: state.user.id });
          }
        }

        const summary = $("#f_lesson_summary").value;
        const updates = { status: "completed" };
        if (summary !== (s.lesson_summary || "")) updates.lesson_summary = summary;
        await upd("sessions", sessionId, updates);

        const hwTitle = $("#f_hw_title").value.trim();
        if (hwTitle) {
          const topicId = topics.length ? $("#f_hw_topic_id").value || null : null;
          const dueAt = $("#f_hw_due_at").value;
          const instructions = $("#f_hw_instructions").value;
          const { error } = await db.from("homework").insert(ids.map(sid => ({
            student_id: sid, class_id: s.class_id, topic_id: topicId,
            title: hwTitle, instructions, assigned_at: s.session_date, due_at: dueAt,
          })));
          if (error) throw error;
        }

        closeModal(); toast("Register saved.", "ok"); render();
      } catch (e) { fail(e); }
    },
  });
  // lets the toggle-topic-covered click handler regenerate just the grid,
  // without wiping whatever's already typed elsewhere in the modal
  $("#modal-host").__renderTopicGrid = renderTopicGrid;
}

/* -------------------------------------------------------------- ACCOUNTS --- */
/* A sign-up can only ever land as a parent, a student, or a tutor awaiting
   approval — the sign-up form says as much. This is where an admin turns
   one of those into a real tutor or a second admin, approves a pending
   tutor sign-up, or hands the centre off to someone else. A pending tutor
   sees none of the centre's data until approved here: is_tutor()/is_staff()
   only match the literal 'tutor', never 'pending_tutor'. */
const ROLE_OPTS = [
  { value: "admin", label: "Admin" },
  { value: "tutor", label: "Tutor" },
  { value: "parent", label: "Parent" },
  { value: "student", label: "Student" },
];

ADMIN.accounts = async function (view) {
  const all = await sel("profiles", q => q.order("full_name"));
  const term = (state.acctSearch || "").trim().toLowerCase();
  let profiles = term
    ? all.filter(p => (p.full_name + " " + (p.email || "")).toLowerCase().includes(term))
    : all;
  profiles = profiles.slice().sort((a, b) =>
    (a.role === "pending_tutor" ? 0 : 1) - (b.role === "pending_tutor" ? 0 : 1));
  const pending = all.filter(p => p.role === "pending_tutor").length;

  const rows = profiles.map(p => {
    const isMe = p.id === state.user.id;
    const isPending = p.role === "pending_tutor";
    const opts = isPending ? [{ value: "pending_tutor", label: "Pending tutor approval" }].concat(ROLE_OPTS) : ROLE_OPTS;
    return "<tr><td><b>" + esc(p.full_name || "—") + "</b>" + (isMe ? ' <span class="pill">you</span>' : "") +
      (isPending ? ' <span class="pill hl">awaiting approval</span>' : "") +
      (p.is_active ? "" : ' <span class="pill bad">inactive</span>') + "</td>" +
      "<td>" + esc(p.email || "—") + "</td>" +
      "<td>" + esc(p.phone || "—") + "</td>" +
      '<td><select name="acct_role_' + p.id + '"' + (isMe ? " disabled" : "") + ">" +
        opts.map(r => '<option value="' + r.value + '"' + (p.role === r.value ? " selected" : "") +
          (r.value === "pending_tutor" ? " disabled" : "") + ">" + r.label + "</option>").join("") +
      "</select></td>" +
      '<td class="act">' + (isMe ? '<span class="hint">that\'s you</span>' :
        '<button class="btn btn-sm btn-mint" data-act="acct-save-role" data-id="' + p.id + '">' +
          (isPending ? "Approve" : "Save") + "</button>") + "</td></tr>";
  });

  view.innerHTML =
    pageHead("Accounts", term ? profiles.length + " of " + all.length + " shown" : all.length + " signed up") +
    '<div class="filters">' +
      fText("acctsearch", "Search", state.acctSearch || "", { placeholder: "Name or email" }) +
      '<button class="btn btn-ghost" data-act="acct-search">Search</button>' +
      (term ? '<button class="btn btn-ghost" data-act="acct-search-clear">Clear</button>' : "") +
    "</div>" +
    (pending ? '<div class="note hl">' + pending + " tutor sign-up" + (pending > 1 ? "s are" : " is") +
      " waiting for approval. They can't see any student, schedule or homework data until you set their role to Tutor below.</div>" : "") +
    '<div class="note">New accounts sign up as a parent, a student, or a tutor awaiting approval. Change the role below to make one a real tutor or an admin — they see the matching menu next time they sign in.</div>' +
    card("", profiles.length ? table(["Account", "Email", "Phone", "Role", ""], rows)
      : emptyState("⚿", term ? "Nobody matches that" : "No accounts yet", ""), "", true);
};

/* A focused roster of just the tutors — who's approved, who's still waiting,
   and what they're actually assigned to teach. Accounts still has every role
   and the full role-picker; this reuses the same acct-save-role action so
   approving/demoting works identically from either page. */
ADMIN.tutors = async function (view) {
  const all = await sel("profiles", q => q.in("role", ["tutor", "pending_tutor"]).order("full_name"));
  const classes = await sel("classes", q => q.eq("is_active", true).order("name"));
  const byTutor = {};
  classes.forEach(c => { if (c.tutor_id) (byTutor[c.tutor_id] = byTutor[c.tutor_id] || []).push(c.name); });
  const pending = all.filter(p => p.role === "pending_tutor").length;

  const rows = all.map(p => {
    const isPending = p.role === "pending_tutor";
    const opts = isPending ? [{ value: "pending_tutor", label: "Pending tutor approval" }].concat(ROLE_OPTS) : ROLE_OPTS;
    const taught = byTutor[p.id] || [];
    return "<tr><td><b>" + esc(p.full_name || "—") + "</b>" +
      (isPending ? ' <span class="pill hl">awaiting approval</span>' : "") + "</td>" +
      "<td>" + esc(p.email || "—") + "</td>" +
      "<td>" + esc(p.phone || "—") + "</td>" +
      "<td>" + (taught.length ? esc(taught.join(", ")) : "<span class='hint'>not teaching yet</span>") + "</td>" +
      '<td><select name="acct_role_' + p.id + '">' +
        opts.map(r => '<option value="' + r.value + '"' + (p.role === r.value ? " selected" : "") +
          (r.value === "pending_tutor" ? " disabled" : "") + ">" + r.label + "</option>").join("") +
      "</select></td>" +
      '<td class="act"><button class="btn btn-sm btn-mint" data-act="acct-save-role" data-id="' + p.id + '">' +
        (isPending ? "Approve" : "Save") + "</button></td></tr>";
  });

  view.innerHTML =
    pageHead("Tutors", all.length + " tutor account" + (all.length === 1 ? "" : "s"),
      '<button class="btn btn-ghost" data-act="nav" data-route="accounts">All accounts</button>') +
    (pending ? '<div class="note hl">' + pending + " tutor sign-up" + (pending > 1 ? "s are" : " is") +
      " waiting for approval. They can't see any student, schedule or homework data until approved.</div>" : "") +
    card("", all.length ? table(["Tutor", "Email", "Phone", "Teaching", "Role", ""], rows)
      : emptyState("◔", "No tutors yet",
          "They appear here once someone signs up as a tutor, or you promote an account from Accounts."), "", true);
};

function invPill(i) {
  if (i.status === "paid") return "ok";
  if (i.status === "void") return "";
  if (i.status === "sent" && i.due_at && i.due_at < today()) return "bad";
  return "warn";
}

ADMIN.billing = async function (view) {
  const [invoices, students, parents] = await Promise.all([
    sel("invoices", q => q.order("issued_at", { ascending: false }).limit(300)),
    sel("students"), sel("profiles", q => q.eq("role", "parent")),
  ]);
  const smap = byId(students), pmap = byId(parents);

  const owed = invoices.filter(i => i.status === "sent").reduce((a, i) => a + i.amount_cents, 0);
  const overdue = invoices.filter(i => i.status === "sent" && i.due_at && i.due_at < today());
  const paidThisMonth = invoices.filter(i => i.status === "paid" && String(i.paid_at || "").slice(0, 7) === today().slice(0, 7))
    .reduce((a, i) => a + i.amount_cents, 0);

  const rows = invoices.map(i => {
    const late = i.status === "sent" && i.due_at && i.due_at < today();
    return "<tr><td><b>" + esc(i.invoice_no) + "</b><br><span style='color:var(--ink-faint);font-size:12px'>" +
      esc(i.description || "") + "</span></td>" +
      "<td>" + esc(nameOf(smap, i.student_id)) + "<br><span style='color:var(--ink-faint);font-size:12px'>" +
      esc(nameOf(pmap, i.parent_id, "no parent linked")) + "</span></td>" +
      "<td>" + esc(fmtDate(i.issued_at)) + "</td>" +
      "<td>" + esc(fmtDate(i.due_at)) + (late ? '<br><span class="pill bad">' + Math.abs(daysUntil(i.due_at)) + " days late</span>" : "") + "</td>" +
      '<td class="num">' + i.lessons + "</td>" +
      '<td class="num money">' + money(i.amount_cents) + "</td>" +
      '<td><span class="pill ' + invPill(i) + '">' + esc(i.status) + "</span></td>" +
      '<td class="act">' +
        '<button class="btn btn-sm btn-ghost" data-act="print-invoice" data-id="' + i.id + '">' +
          (i.status === "paid" ? "Receipt" : "Invoice") + "</button> " +
        (i.status === "draft" ? '<button class="btn btn-sm btn-ghost" data-act="inv-set" data-id="' + i.id + '" data-v="sent">Send</button> ' : "") +
        (i.status !== "paid" && i.status !== "void"
          ? '<button class="btn btn-sm btn-mint" data-act="record-payment" data-id="' + i.id + '">Record payment</button> ' +
            '<button class="btn btn-sm btn-danger" data-act="inv-set" data-id="' + i.id + '" data-v="void">Void</button>' : "") +
      "</td></tr>";
  });

  const filter = state.invFilter || "all";
  const shown = rows.filter((_, idx) => filter === "all" || invoices[idx].status === filter ||
    (filter === "overdue" && invoices[idx].status === "sent" && invoices[idx].due_at && invoices[idx].due_at < today()));

  view.innerHTML =
    pageHead("Invoices", "Send the invoice, then record the payment when it lands",
      '<button class="btn btn-ghost" data-act="export-invoices">Export to CSV</button>' +
      '<button class="btn btn-primary" data-act="new-invoice">New invoice</button>') +
    '<div class="cols cols-3" style="margin-bottom:18px">' +
      '<div class="stat"><div class="k">Outstanding</div><div class="v">' + money(owed) + '</div><div class="n">' + invoices.filter(i => i.status === "sent").length + " unpaid invoices</div></div>" +
      '<div class="stat' + (overdue.length ? " alert" : "") + '"><div class="k">Overdue</div><div class="v">' + overdue.length + '</div><div class="n">past the due date</div></div>' +
      '<div class="stat"><div class="k">Collected this month</div><div class="v">' + money(paidThisMonth) + '</div><div class="n">' + MON3[new Date().getMonth()] + " " + new Date().getFullYear() + "</div></div>" +
    "</div>" +
    '<div class="filters">' +
      ["all", "draft", "sent", "overdue", "paid", "void"].map(f =>
        '<button class="kid-tab" aria-selected="' + (filter === f) + '" data-act="inv-filter" data-v="' + f + '">' +
        f[0].toUpperCase() + f.slice(1) + "</button>").join("") +
    "</div>" +
    card("", shown.length ? table(["Invoice", "For", "Issued", "Due", { t: "Lessons", num: true },
      { t: "Amount", num: true }, "Status", ""], shown)
      : emptyState("$", invoices.length ? "Nothing in this list" : "No invoices yet",
          invoices.length ? "Try another filter." : "Sell a package to a student to raise the first one."), "", true);

ADMIN.progress = async function (view) {

  if (!students.length) {
    view.innerHTML = pageHead("Progress", "") + card("", emptyState("▲", "No students yet", ""));
    return;
  }
  if (!state.progressStudent || !students.some(s => s.id === state.progressStudent)) {
    state.progressStudent = students[0].id;
  }
  const sid = state.progressStudent;
  const student = students.find(s => s.id === sid);

  const [mastery, topics, subjects, hw, att] = await Promise.all([
    sel("topic_mastery", q => q.eq("student_id", sid)),
    sel("topics", q => q.order("sort_order")), sel("subjects"),
    sel("homework", q => q.eq("student_id", sid).eq("status", "graded").order("graded_at", { ascending: false }).limit(40)),
    sel("attendance", q => q.eq("student_id", sid)),
  ]);
  view.innerHTML = pageHead("Progress", "Topic scores come from the last eight graded pieces of work") +
    '<div class="filters">' +
      fSelect("progstudent", "Student", sid, students.map(s => ({ value: s.id, label: s.full_name }))) +
    "</div>" +
    progressBlock(student, mastery, topics, subjects, hw, att, true);
};

function progressBlock(student, mastery, topics, subjects, hw, att, isAdmin) {
  const tmap = byId(topics), smap = byId(subjects);

  // only subjects this student actually has topic scores in get a tab
  const subjectIds = [...new Set(mastery.map(m => (tmap[m.topic_id] || {}).subject_id).filter(Boolean))];
  const subjectTabs = subjectIds.map(id => smap[id]).filter(Boolean).sort((a, b) => a.name.localeCompare(b.name));
  if (state.progressSubject !== "all" && !subjectIds.includes(state.progressSubject)) state.progressSubject = "all";
  const activeSubject = state.progressSubject;

  const inSubject = topicId => activeSubject === "all" || (tmap[topicId] || {}).subject_id === activeSubject;
  const mrows = mastery.filter(m => inSubject(m.topic_id)).sort((a, b) => (a.manual_score || a.score) - (b.manual_score || b.score));
  const hwInSubject = hw.filter(h => inSubject(h.topic_id));
  const present = att.filter(a => a.status === "present" || a.status === "late").length;

  const tabsBar = subjectTabs.length > 1 ? '<div class="filters">' +
    '<button class="kid-tab" aria-selected="' + (activeSubject === "all") + '" data-act="progress-subject-tab" data-v="all">All subjects</button>' +
    subjectTabs.map(sub => '<button class="kid-tab" aria-selected="' + (activeSubject === sub.id) +
      '" data-act="progress-subject-tab" data-v="' + sub.id + '">' + esc(sub.name) + "</button>").join("") +
    "</div>" : "";

  const bars = mrows.map(m => {
    const t = tmap[m.topic_id] || {};
    const v = Number(m.manual_score !== null && m.manual_score !== undefined ? m.manual_score : m.score);
    return '<div class="mrow' + (isAdmin ? " adm" : "") + '"><div class="nm">' + esc(t.name || "Topic") +
      "<small>" + esc(nameOf(smap, t.subject_id)) + " · " + m.samples + " marked · " + bandWord(v) + "</small></div>" +
      '<div class="bar"><i class="' + bandClass(v) + '" style="width:' + Math.max(3, Math.min(100, v)) + '%"></i></div>' +
      '<div class="pc">' + Math.round(v) +
        (m.manual_score !== null && m.manual_score !== undefined ? '<br><span class="pill hl">set</span>' : "%") + "</div>" +
      (isAdmin ? '<div class="pc"><button class="btn btn-sm btn-ghost" data-act="mastery-set" data-student="' +
        m.student_id + '" data-topic="' + m.topic_id + '" data-score="' +
        (m.manual_score === null || m.manual_score === undefined ? "" : m.manual_score) + '">Override</button></div>' : "") +
      "</div>";
  }).join("");

  const avg = hwInSubject.length ? Math.round(hwInSubject.reduce((a, h) => a + pct(h.score, h.max_score), 0) / hwInSubject.length) : null;

  const hwRows = hwInSubject.slice(0, 15).map(h =>
    "<tr><td>" + esc(h.title) + "</td><td>" + esc(nameOf(tmap, h.topic_id, "—")) + "</td>" +
    "<td>" + esc(fmtDate(h.graded_at)) + "</td>" +
    '<td class="num"><b>' + pct(h.score, h.max_score) + "%</b></td>" +
    "<td>" + esc(h.feedback || "") + "</td></tr>");

  return tabsBar +
    '<div class="cols cols-3" style="margin-bottom:18px">' +
      '<div class="stat"><div class="k">Average score</div><div class="v">' + (avg === null ? "—" : avg + "%") + '</div><div class="n">across ' + hwInSubject.length + " graded tasks</div></div>" +
      '<div class="stat"><div class="k">Lessons attended</div><div class="v">' + present + '</div><div class="n">of ' + att.length + " marked</div></div>" +
      '<div class="stat"><div class="k">Topics tracked</div><div class="v">' + mrows.length + '</div><div class="n">weakest shown first</div></div>' +
    "</div>" +
    card("Topic by topic",
      mrows.length ? '<div class="mastery">' + bars + "</div>"
        : emptyState("◈", "No topic scores yet", "Tag homework with a topic and grade it — scores build from there.")) +
    card("Recent graded work",
      hwRows.length ? table(["Task", "Topic", "Marked", { t: "Score", num: true }, "Feedback"], hwRows)
        : emptyState("✐", "Nothing graded yet", ""), "", true);
}

ADMIN.topics = async function (view) {

  ]);
  const lvMap = byId(levels), stMap = byId(streams);
  const blocks = subjects.map(s => {
    const list = topics.filter(t => t.subject_id === s.id);
    return card(s.name, list.length
      ? table(["#", "Topic", "Level", "Stream", ""], list.map(t =>
          '<tr><td class="num">' + t.sort_order + "</td><td><b>" + esc(t.name) + "</b></td>" +

    '<button class="btn btn-sm btn-danger" data-act="' + delAct + '" data-id="' + x.id + '">Delete</button></td></tr>');

  view.innerHTML =
    pageHead("Topics", "The chapters a student's proficiency is scored against",
      '<button class="btn btn-ghost" data-act="subject-add">Add a subject</button>') +
    '<div class="note">Levels and streams are set up once here, then picked from a dropdown everywhere a class or a student needs one — a class needs a subject, a level and a stream; a student has one level and, through whichever classes they\'re enrolled in, a stream per subject. Drag a row to reorder it.</div>' +
    '<div class="cols cols-2">' +
      card("Levels", levels.length ? table(["", "Level", ""], dragRows(levels, "levels", "level-edit", "level-del"))
        : emptyState("◱", "No levels yet", "e.g. P1–P6, Sec 1–5, JC1–2 — whatever this centre teaches."),
        '<button class="btn btn-sm btn-mint" data-act="level-edit">Add a level</button>', true) +

        '<button class="btn btn-sm btn-mint" data-act="stream-edit">Add a stream</button>', true) +

/* Sessions a student is expected at, between two dates. */
async function studentSessions(studentId, from, to) {
  const [enrols, bookings, reports] = await Promise.all([
    sel("enrolments", q => q.eq("student_id", studentId).eq("status", "active")),
    sel("bookings", q => q.eq("student_id", studentId).in("status", ["confirmed", "requested"])),
    sel("absence_reports", q => q.eq("student_id", studentId)),
  ]);
  const classIds = enrols.map(e => e.class_id);
  const sessions = await sel("sessions", q => q.gte("session_date", from).lte("session_date", to).order("session_date").order("start_time"));
  const bmap = {}; bookings.forEach(b => (bmap[b.session_id] = b));
  const rmap = {}; reports.forEach(r => (rmap[r.session_id] = r));
  return sessions
    .filter(s => classIds.includes(s.class_id) || bmap[s.id])
    .map(s => Object.assign({}, s, { booking: bmap[s.id] || null, absenceReport: rmap[s.id] || null }));
}

function sessionCards(list, classes, showActions, studentId) {
  const cmap = byId(classes);
  if (!list.length) return emptyState("◷", "Nothing scheduled", "Open slots you can book appear on the booking page.");
  return table(["When", "Class", "Where", "Status", ""], list.map(s => {
    const c = cmap[s.class_id] || {};
    const b = s.booking;
    const r = s.absenceReport;
    const future = s.session_date >= today();
    let statusPill = b
      ? '<span class="pill ' + (b.status === "confirmed" ? "ok" : "warn") + '">' + esc(b.status) + "</span>"
      : '<span class="pill info">enrolled</span>';
    if (!b && r) {
      statusPill = r.redeemed_booking_id
        ? '<span class="pill ok">makeup booked</span>'
        : '<span class="pill warn">absence reported</span>';
    }
    let action = "";
    if (showActions && b && b.status !== "cancelled" && future) {
      action = '<button class="btn btn-sm btn-ghost" data-act="cancel-booking" data-id="' + b.id + '" data-date="' + s.session_date +
        '" data-time="' + s.start_time + '">Cancel</button>';
    } else if (showActions && !b && !r && s.status === "scheduled" && future) {
      action = '<button class="btn btn-sm btn-ghost" data-act="report-absence" data-session="' + s.id +
        '" data-student="' + studentId + '" data-date="' + s.session_date + '">Report absence</button>';
    }
    return "<tr><td><b>" + esc(fmtDate(s.session_date)) + "</b><br>" + esc(fmtRange(s.start_time, s.end_time)) + "</td>" +
      "<td>" + esc(c.name || "Class") + "<br><span style='color:var(--ink-faint);font-size:12px'>" +
      esc(s.tutor_name || c.tutor_name || "") + "</span></td>" +
      "<td>" + esc(s.room || c.room || "—") + "</td>" +
      "<td>" + (s.status === "cancelled" ? '<span class="pill bad">cancelled</span>' : statusPill) + "</td>" +
      '<td class="act">' + action + "</td></tr>";
  }));
}

  const blocks = [];
  for (const s of state.students) {
    const upcoming = await studentSessions(s.id, today(), addDays(today(), 14));
    const next = upcoming.filter(x => x.status !== "cancelled")[0];
    const cmap = byId(classes);
    const low = Number(s.credits) <= Number(s.low_credit_at);
    blocks.push(card(s.full_name,
      '<div class="lbl">Lesson credits</div>' + creditStrip(s.credits) + creditLine(s.credits) +
      (low ? '<div class="note hl" style="margin-top:10px">Credits are running low. Top up so lessons are not interrupted.</div>' : "") +
      "<div class='divider'></div>" +
      '<div class="lbl">Next lesson</div>' +
      (next ? "<p><b>" + esc(nameOf(cmap, next.class_id)) + "</b><br>" + esc(fmtDate(next.session_date)) + " · " +
        esc(fmtRange(next.start_time, next.end_time)) + "</p>"
            : "<p class='hint'>Nothing booked in the next two weeks.</p>") +
      '<div class="row"><span class="points-badge">★ ' + s.points + " points</span>" +
      '<span class="pill">' + esc(nameOf(lvMap, s.level_id, "—")) + "</span></div>",
      '<button class="btn btn-sm btn-mint" data-act="nav" data-route="billing">Top up</button>'));
  }

  const due = invoices.filter(i => i.status === "sent");
  const owed = due.reduce((a, i) => a + i.amount_cents, 0);

  view.innerHTML =
    pageHead("Overview", "Everything for your " + (state.students.length > 1 ? "children" : "child") + " in one place") +
    (owed ? '<div class="note hl"><b>' + money(owed) + " outstanding</b> across " + due.length +
      ' invoice' + (due.length > 1 ? "s" : "") + '. <a href="#/billing">Pay now</a></div>' : "") +
    '<div class="cols cols-2">' + blocks.join("") + "</div>";
};

/* ------------------------------------------------------------ PARENT: book -- */
async function bookableView(view) {
  if (!state.students.length) return noStudentYet(view);
  const s = currentStudent();
  const kids = state.students;
  const kidIds = kids.map(k => k.id);
  const wFrom = state.bookFrom, wTo = addDays(wFrom, 6);
  const [adhocSessions, classes, allBookings, allReports, myEnrols, allEnrols, myRequests, subjects] = await Promise.all([
    sel("sessions", q => q.eq("is_bookable", true).eq("status", "scheduled")
      .gte("session_date", wFrom).lte("session_date", wTo).order("session_date").order("start_time")),
    sel("classes", q => q.eq("is_active", true)),
    sel("bookings", q => q.in("student_id", kidIds).in("status", ["requested", "confirmed", "waitlisted"])),
    sel("absence_reports", q => q.in("student_id", kidIds)),
    sel("enrolments", q => q.eq("student_id", s.id).eq("status", "active")),
    sel("enrolments", q => q.eq("status", "active")),
    sel("lesson_requests", q => q.eq("student_id", s.id).order("created_at", { ascending: false }).limit(10)),
    sel("subjects", q => q.order("name")),
  ]);
  const cmap = byId(classes);

  // fixed classes with a spare seat, in a subject (and stream) this student
  // already takes elsewhere, matching their level — a drop-in, not a
  // permanent enrolment. Subject alone isn't enough to gate this: a G2
  // student shouldn't be offered a spare seat in a G3 class of the same
  // subject, so the match is subject+stream together. Browsing stays
  // scoped to whichever kid's tab is active; which siblings can also be
  // booked into any one item is worked out per item below.
  const myClassIds = myEnrols.map(e => e.class_id);
  const mySubjectStreams = new Set(myClassIds.map(id => cmap[id]).filter(Boolean).map(c => c.subject_id + "_" + c.stream_id));
  const enrolledCount = {};
  allEnrols.forEach(e => (enrolledCount[e.class_id] = (enrolledCount[e.class_id] || 0) + 1));
  const openClasses = classes.filter(c =>
    c.kind === "fixed" && c.level_id === s.level_id && mySubjectStreams.has(c.subject_id + "_" + c.stream_id) &&
    !myClassIds.includes(c.id) && (enrolledCount[c.id] || 0) < c.capacity);
  const seatsLeft = {}; openClasses.forEach(c => (seatsLeft[c.id] = c.capacity - (enrolledCount[c.id] || 0)));

  const openFixedSessions = openClasses.length ? await sel("sessions", q =>
    q.in("class_id", openClasses.map(c => c.id)).eq("status", "scheduled")
     .gte("session_date", wFrom).lte("session_date", wTo)
     .order("session_date").order("start_time")) : [];

  const seen = {};
  const sessions = adhocSessions.concat(openFixedSessions).filter(x => (seen[x.id] ? false : (seen[x.id] = true)));

  // per-child booking status, absence-to-make-up, and (for the fixed-class
  // drop-in case only) subject/level eligibility — ad-hoc slots have no
  // subject restriction, so only credits gate those
  const takenMap = {}; allBookings.forEach(b => (takenMap[b.student_id + "_" + b.session_id] = b));
  const makeupByKid = {};
  kids.forEach(k => {
    const open = allReports.filter(r => r.student_id === k.id && !r.redeemed_booking_id);
    makeupByKid[k.id] = open.sort((a, b) => a.reported_at.localeCompare(b.reported_at))[0] || null;
  });
  const kidEnrolSet = {}, kidSubjectStreamSet = {};
  kids.forEach(k => {
    kidEnrolSet[k.id] = new Set(allEnrols.filter(e => e.student_id === k.id).map(e => e.class_id));
    kidSubjectStreamSet[k.id] = new Set([...kidEnrolSet[k.id]].map(cid => cmap[cid]).filter(Boolean)
      .map(c => c.subject_id + "_" + c.stream_id));
  });
  const eligibleFor = (x, c, isOpenClass) => kids.filter(k =>
    Number(k.credits) > 0 &&
    (!isOpenClass || (c.level_id === k.level_id && kidSubjectStreamSet[k.id].has(c.subject_id + "_" + c.stream_id) && !kidEnrolSet[k.id].has(c.id))));

  const noCredits = Number(s.credits) <= 0;
  const makeup = makeupByKid[s.id];
  const makeupSession = makeup ? (await sel("sessions", q => q.eq("id", makeup.session_id)))[0] : null;
  const makeupDate = makeupSession ? fmtDate(makeupSession.session_date) : "";

  // the hour band worth drawing — derived from actual class and session
  // times rather than a guessed-at fixed range. Ad-hoc classes have no
  // start_time/end_time of their own (each session sets its own), so
  // fixed classes alone would silently miss them — this looks at both.
  let hFrom = 24, hTo = 0;
  const spanHours = (start, end) => {
    if (!start || !end) return;
    hFrom = Math.min(hFrom, Number(start.slice(0, 2)));
    hTo = Math.max(hTo, Number(end.slice(0, 2)) + (end.slice(3, 5) > "00" ? 1 : 0));
  };
  classes.forEach(c => spanHours(c.start_time, c.end_time));
  sessions.forEach(x => spanHours(x.start_time, x.end_time));
  if (hFrom > hTo) { hFrom = 14; hTo = 21; }

  // one RPC call for the whole week's grid, rather than one per cell — and
  // only bother at all once there's a subject to actually browse for
  let freeMap = {};
  if (mySubjectStreams.size) {
    const { data, error } = await db.rpc("tutor_availability_grid", { p_from: wFrom, p_to: wTo, p_start_hour: hFrom, p_end_hour: hTo });
    if (!error && Array.isArray(data)) data.forEach(g => (freeMap[g.slot_date + "_" + g.slot_hour] = g.tutors_free));
  }

  const sessByCell = {};
  sessions.forEach(x => (sessByCell[x.session_date + "_" + Number(x.start_time.slice(0, 2))] = x));

  const cellFor = (d, h) => {
    const key = d + "_" + h;
    const x = sessByCell[key];
    if (x) {
      const c = cmap[x.class_id] || {};
      const isOpenClass = seatsLeft[x.class_id] !== undefined;
      let body;
      if (kids.length < 2) {
        const b = takenMap[s.id + "_" + x.id];
        let action = '<button class="btn btn-sm btn-mint" data-act="request-booking" data-id="' + x.id + '"' +
          (noCredits ? " disabled" : "") + ">Request</button>";
        if (!b && makeup) {
          action = '<button class="btn btn-sm btn-mint" data-act="redeem-makeup" data-session="' + x.id + '" data-report="' + makeup.id + '"' +
            (noCredits ? " disabled" : "") + ">Makes up " + esc(makeupDate) + "</button>";
        }
        body = b ? '<span class="pill ' + (b.status === "confirmed" ? "ok" : "warn") + '">' + esc(b.status) + "</span>" : action;
      } else {
        const eligible = eligibleFor(x, c, isOpenClass);
        const kidRows = eligible.map(k => {
          const b = takenMap[k.id + "_" + x.id];
          if (b) return '<div><span class="pill ' + (b.status === "confirmed" ? "ok" : "warn") + '">' +
            esc(k.full_name) + " · " + esc(b.status) + "</span></div>";
          const km = makeupByKid[k.id];
          return '<label class="check" style="display:block;font-size:12px">' +
            '<input type="checkbox" class="kid-book-box" data-session="' + x.id + '" data-kid="' + k.id +
            '" data-report="' + (km ? km.id : "") + '" checked> ' + esc(k.full_name) +
            (km ? " (makes up a missed lesson)" : "") + "</label>";
        }).join("");
        const anyPickable = eligible.some(k => !takenMap[k.id + "_" + x.id]);
        body = kidRows + (anyPickable
          ? '<button class="btn btn-sm btn-mint" style="margin-top:4px" data-act="multi-book" data-id="' + x.id + '">Book selected</button>' : "");
      }
      return '<div class="sess' + (isOpenClass ? " adhoc" : "") + '">' +
        '<div class="t">' + esc(fmtRange(x.start_time, x.end_time)) + "</div>" +
        '<div class="n">' + esc(c.name || "Class") + "</div>" +
        (isOpenClass ? '<div class="m">' + seatsLeft[x.class_id] + " seat" + (seatsLeft[x.class_id] === 1 ? "" : "s") + " left</div>" : "") +
        '<div style="margin-top:5px">' + body + "</div></div>";
    }
    const free = freeMap[key];
    if (free === undefined) return "";
    return free > 0
      ? '<div class="slot-chip free" data-act="calendar-request-lesson" data-date="' + d + '" data-hour="' + h +
        '">' + esc(fmtTime(String(h).padStart(2, "0") + ":00")) + "<br>free</div>"
      : '<div class="slot-chip busy" title="No tutor free at this time">' + esc(fmtTime(String(h).padStart(2, "0") + ":00")) + "</div>";
  };

  const hours = []; for (let h = hFrom; h < hTo; h++) hours.push(h);
  const cols = [];
  for (let i = 0; i < 7; i++) {
    const d = addDays(wFrom, i);
    cols.push('<div class="week-col' + (d === today() ? " today" : "") + '">' +
      '<div class="dh">' + DOW3[new Date(d + "T00:00:00").getDay()] + " <b>" + fmtDateShort(d) + "</b></div>" +
      hours.map(h => cellFor(d, h)).join("") + "</div>");
  }

  view.innerHTML =
    pageHead("Book a slot", "Open sessions, classes with a spare seat, and times a tutor could cover",
      '<div class="btn-row">' +
        '<button class="btn btn-ghost" data-act="book-week" data-d="-7"' + (wFrom <= today() ? " disabled" : "") + '>‹ Previous</button>' +
        '<button class="btn btn-ghost" data-act="book-week" data-d="0">This week</button>' +
        '<button class="btn btn-ghost" data-act="book-week" data-d="7">Next ›</button></div>') +
    studentTabs() +
    (noCredits ? '<div class="note bad">' + esc(s.full_name) + " has no lesson credits left. Top up before booking.</div>" : "") +
    (makeup ? '<div class="note hl">A missed lesson on ' + esc(makeupDate) +
      " was reported in advance — book any open slot below to make it up.</div>" : "") +
    (mySubjectStreams.size ? "" : '<div class="note">Once ' + esc(s.full_name) +
      " is enrolled in a class, open slots and available times for that subject show up here.</div>") +
    card(fmtDate(wFrom) + " – " + fmtDate(wTo),
      '<div class="tbl-wrap"><div class="week-grid">' + cols.join("") + "</div></div>" +
      "<p class='hint' style='margin-top:12px'>Green — a tutor could cover this time; propose it below. Red — nobody's free. Class cards book instantly.</p>",
      "", true) +
    card("Don't see a time that works?",
      "<p class='hint' style='margin-bottom:12px'>Propose a day and time — the centre will confirm it and assign a tutor.</p>" +
      '<button class="btn btn-mint" data-act="lesson-request">Request a lesson</button>' +
      (myRequests.length ? "<div class='divider'></div>" + table(["Requested", "Subject", "Status"], myRequests.map(r => {
        const subj = subjects.find(x => x.id === r.subject_id);
        const pill = r.status === "scheduled" ? "ok" : r.status === "declined" ? "bad" : "warn";
        return "<tr><td>" + esc(fmtDate(r.requested_date)) + " " + esc(fmtTime(r.requested_time)) + "</td>" +
          "<td>" + esc(subj ? subj.name : "—") + "</td>" +
          '<td><span class="pill ' + pill + '">' + esc(r.status) + "</span></td></tr>";
      })) : ""));
}

async function lessonRequestForm(presetDate, presetHour) {
  const s = currentStudent();
  const multi = state.students.length > 1;
  const subjects = await sel("subjects", q => q.order("name"));
  openModal({
    title: multi ? "Request a lesson" : "Request a lesson for " + s.full_name,
    body:
      fSelect("subject_id", "Subject", "", subjects.map(x => ({ value: x.id, label: x.name })), { blank: "— choose —" }) +
      '<div class="grid-2">' +
        fText("requested_date", "Preferred date", presetDate || addDays(today(), 3), { type: "date" }) +
        fText("requested_time", "Preferred time", presetHour !== undefined ? String(presetHour).padStart(2, "0") + ":00" : "16:00", { type: "time" }) +
      "</div>" +
      (multi
        ? '<div class="field"><label>For</label>' +
          state.students.map(k => '<label class="check" style="display:block"><input type="checkbox" class="req-kid-box" data-kid="' +
            k.id + '"' + (k.id === s.id ? " checked" : "") + "> " + esc(k.full_name) + "</label>").join("") +
          "</div>"
        : "") +
      fArea("note", "Anything the centre should know", ""),
    onSave: async () => {
      const v = modalValues();
      if (!v.subject_id) return toast("Choose a subject.", "bad");
      const forKids = multi ? $$(".req-kid-box:checked").map(el => el.dataset.kid) : [s.id];
      if (!forKids.length) return toast("Pick at least one student.", "bad");
      try {
        for (const kid of forKids) {
          await ins("lesson_requests", {
            student_id: kid, subject_id: v.subject_id, requested_date: v.requested_date,
            requested_time: v.requested_time, note: v.note, requested_by: state.user.id,
          });
        }
        closeModal(); toast("Request sent — the centre will confirm a time.", "ok"); render();
      } catch (e) { fail(e); }
    },
  });
}

STUDENT.homework = async function (view) {

/* ------------------------------------------------------------------ CSV ---- */
function csvCell(v) {
  if (v === null || v === undefined) return "";
  const s = String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function downloadCsv(filename, headers, rows) {
  const body = [headers.join(",")].concat(rows.map(r => r.map(csvCell).join(","))).join("\n");
  try {
    const blob = new Blob(["\ufeff" + body], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast("Downloaded " + filename, "ok");
  } catch (e) {
    copyText(body, "Spreadsheet data");
  }
}

/* ============================================================================
   TEST RESULTS
   Two kinds share one record. A centre test is entered by staff, tagged to a
   topic, and counts towards the topic score. A school test can be entered by
   anyone, needs a photo of the report slip, and only earns points once an
   administrator has approved it.
   ========================================================================== */

const SLIP_BUCKET = "report-slips";

function gradePill(a) {
  if (!a.grade_label) return '<span class="pill">—</span>';
  const p = pct(a.score, a.max_score);
  return '<span class="pill ' + (p >= 75 ? "ok" : p >= 55 ? "info" : p >= 40 ? "warn" : "bad") + '">' +
    esc(a.grade_label) + "</span>";
}
function statusPill(a) {
  return '<span class="pill ' + (a.status === "approved" ? "ok" : a.status === "rejected" ? "bad" : "warn") + '">' +
    esc(a.status) + "</span>";
}

/* Small inline trend chart — percentage over time for one subject. */
function trendChart(points) {
  if (points.length < 2) return "";
  const w = 260, h = 64, pad = 6;
  const xs = points.map((_, i) => pad + (i * (w - pad * 2)) / (points.length - 1));
  const ys = points.map(p => h - pad - (Math.max(0, Math.min(100, p.pct)) / 100) * (h - pad * 2));
  const path = xs.map((x, i) => (i ? "L" : "M") + x.toFixed(1) + " " + ys[i].toFixed(1)).join(" ");
  const dots = xs.map((x, i) =>
    '<circle cx="' + x.toFixed(1) + '" cy="' + ys[i].toFixed(1) + '" r="3" fill="#15968B"><title>' +
    esc(points[i].label + ": " + points[i].pct + "%") + "</title></circle>").join("");
  return '<svg viewBox="0 0 ' + w + " " + h + '" width="100%" height="64" role="img" aria-label="Score trend">' +
    '<line x1="' + pad + '" y1="' + (h - pad) + '" x2="' + (w - pad) + '" y2="' + (h - pad) + '" stroke="#E6E0D3"/>' +
    '<path d="' + path + '" fill="none" stroke="#15968B" stroke-width="2" stroke-linejoin="round"/>' + dots + "</svg>";
}

async function slipLink(path) {
  if (!path) return "";
  try {
    const { data, error } = await db.storage.from(SLIP_BUCKET).createSignedUrl(path, 300);
    if (error || !data) return '<span class="pill bad">slip unreadable</span>';
    return '<a class="btn btn-sm btn-ghost" href="' + esc(data.signedUrl) + '" target="_blank" rel="noopener">View slip</a>';
  } catch (e) { return '<span class="pill bad">slip unreadable</span>'; }
}

async function assessmentForm(id, opts) {
  opts = opts || {};
  const staff = state.role === "admin" || state.role === "tutor";
  const a = id ? (await sel("assessments", q => q.eq("id", id)))[0] : null;
  const kind = a ? a.kind : staff ? (opts.kind || "centre") : "school";

  const [students, subjects, topics, scales, types] = await Promise.all([

    sel("subjects", q => q.order("name")),
    sel("topics", q => q.order("sort_order")),
    sel("grading_scales", q => q.eq("is_active", true).order("sort_order")),
    sel("exam_types", q => q.eq("is_active", true).order("sort_order")),
  ]);
  const smap = byId(subjects);
  const typeOpts = types.filter(t => t.kind === kind).map(t => ({ value: t.id, label: t.name }));

  openModal({
    title: a ? "Edit result" : kind === "centre" ? "Record a centre test" : "Add a school result",
    wide: true,
    body:
      (kind === "school" && !staff
        ? '<div class="note hl">Attach a clear photo of the report slip. The centre checks it before any points are added.</div>'
        : "") +
      '<div class="grid-2">' +
        fSelect("student_id", "Student", a ? a.student_id : opts.student || "",
          students.map(x => ({ value: x.id, label: x.full_name })), { blank: "Choose a student" }) +
        fSelect("subject_id", "Subject", a ? a.subject_id : "",
          subjects.map(x => ({ value: x.id, label: x.name })), { blank: "Choose a subject" }) +
      "</div>" +
      '<div class="grid-2">' +
        fSelect("exam_type_id", "Which test", a ? a.exam_type_id : "", typeOpts, { blank: "Choose one" }) +
        fText("taken_on", "Date taken", a ? a.taken_on : today(), { type: "date" }) +
      "</div>" +
      fText("title", "Paper or description", a ? a.title : "", { placeholder: kind === "centre" ? "Ch 7 topical test" : "Paper 2" }) +
      '<div class="grid-3">' +
        fText("score", "Marks", a ? a.score : "", { type: "number", step: "0.5", min: 0 }) +
        fText("max_score", "Out of", a ? a.max_score : 100, { type: "number", step: "0.5", min: 1 }) +
        fSelect("scale_id", "Grading scale", a ? a.scale_id : "",
          scales.map(x => ({ value: x.id, label: x.name })), { blank: "Choose a scale", hint: "Decides the grade and the points." }) +
      "</div>" +
      (kind === "centre"
        ? fSelect("topic_id", "Topic", a ? a.topic_id : "",
            topics.map(t => ({ value: t.id, label: nameOf(smap, t.subject_id) + " · " + t.name })),
            { blank: "— no topic —", hint: "Tagging a topic feeds the student's topic score." })
        : '<div class="grid-3">' +
            fText("class_average", "Class average", a ? a.class_average : "", { type: "number", step: "0.1", min: 0 }) +
            fText("class_position", "Position in class", a ? a.class_position : "", { type: "number", min: 1 }) +
            fText("class_size", "Class size", a ? a.class_size : "", { type: "number", min: 1 }) +
          "</div>") +
      (kind === "school"
        ? '<div class="field"><label for="f_slip">Photo of the report slip</label>' +
          '<input id="f_slip" name="slip" type="file" accept="image/*,application/pdf">' +
          '<div class="hint">' + (a && a.slip_path ? "A photo is already attached. Choosing a new one replaces it."
            : "JPG, PNG or PDF, up to 8 MB. Stored privately and only visible to you and the centre.") + "</div></div>"
        : "") +
      fArea("notes", "Notes", a ? a.notes : ""),
    onSave: async () => {
      const v = modalValues();
      delete v.slip;
      if (!v.student_id || !v.subject_id) return toast("Student and subject are both needed.", "bad");
      if (v.score === null || v.score === "") return toast("Enter the marks.", "bad");
      if (Number(v.score) > Number(v.max_score)) return toast("The marks cannot be more than the total.", "bad");

      const file = ($("#f_slip") || {}).files && $("#f_slip").files[0];
      if (kind === "school" && !file && !(a && a.slip_path)) {
        return toast("A photo of the report slip is needed.", "bad");
      }

      const btn = $('[data-act="modal-save"]');
      if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Saving…'; }
      try {
        let slipPath = a ? a.slip_path : null;
        if (file) {
          if (file.size > 8 * 1024 * 1024) throw new Error("That file is larger than 8 MB.");
          const ext = (file.name.split(".").pop() || "jpg").toLowerCase().slice(0, 5);
          const path = v.student_id + "/" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;
          const up = await db.storage.from(SLIP_BUCKET).upload(path, file, { upsert: false });
          if (up.error) throw up.error;
          slipPath = path;
        }
        const row = Object.assign({}, v, { kind: kind, slip_path: slipPath });
        if (a) await upd("assessments", a.id, row); else await ins("assessments", row);
        closeModal();
        toast(staff && kind === "centre" ? "Result saved." : "Sent to the centre to check.", "ok");
        render();
      } catch (e) {
        if (btn) { btn.disabled = false; btn.textContent = "Save"; }
        fail(e);
      }
    },
  });
}

/* --------------------------------------------------- family results view -- */
async function familyResults(view) {
  if (!state.students.length) return noStudentYet(view);
  const s = currentStudent();
  const [list, subjects, types] = await Promise.all([
    sel("assessments", q => q.eq("student_id", s.id).order("taken_on", { ascending: false })),
    sel("subjects"), sel("exam_types"),
  ]);
  const maps = { students: byId(state.students), subjects: byId(subjects), types: byId(types) };

  const approved = list.filter(a => a.status === "approved");
  const bySubject = {};
  approved.slice().reverse().forEach(a => {
    const k = a.subject_id || "none";
    (bySubject[k] = bySubject[k] || []).push({
      pct: pct(a.score, a.max_score),
      label: fmtDateShort(a.taken_on) + " " + nameOf(maps.types, a.exam_type_id, ""),
    });
  });

  const trends = Object.keys(bySubject).filter(k => bySubject[k].length > 1).map(k =>
    '<div style="margin-bottom:14px"><div class="lbl">' + esc(nameOf(maps.subjects, k)) + "</div>" +
    trendChart(bySubject[k]) + "</div>").join("");

  const earned = approved.reduce((n, a) => n + a.points_awarded, 0);

  view.innerHTML =
    pageHead("Test results", s.full_name,
      '<button class="btn btn-primary" data-act="assess-new" data-kind="school" data-student="' + s.id + '">Add a school result</button>') +
    studentTabs() +
    '<div class="cols cols-3" style="margin-bottom:18px">' +
      '<div class="stat"><div class="k">Results on file</div><div class="v">' + approved.length + '</div><div class="n">approved by the centre</div></div>' +
      '<div class="stat"><div class="k">Points from tests</div><div class="v">' + earned + '</div><div class="n">of ' + s.points + " in the balance</div></div>" +
      '<div class="stat"><div class="k">Waiting to be checked</div><div class="v">' +
        list.filter(a => a.status === "pending").length + '</div><div class="n">usually within a few days</div></div>' +
    "</div>" +
    (trends ? card("How it is going", trends) : "") +
    card("Every result", list.length
      ? table(ASSESS_HEAD_FAMILY, assessmentRows(list, maps, "family"))
      : emptyState("◎", "No results yet", "Add a school result and the centre will check it."), "", true);
}

/* ============================================================================
   EVENTS — one delegated handler for the whole page
   ========================================================================== */
async function copyText(text, label) {
  try {
    await navigator.clipboard.writeText(text);
    toast((label || "Copied") + " to the clipboard.", "ok");
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast((label || "Copied") + " to the clipboard.", "ok"); }
    catch (e2) { toast("Select the text and copy it manually.", "bad"); }
    ta.remove();
  }
}

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if (el) {
    ev.preventDefault();
    const fn = ACTIONS[el.dataset.act];
    if (fn) { try { fn(el, ev); } catch (e) { fail(e); } }
    return;
  }
  if (ev.target.classList && ev.target.classList.contains("modal-scrim")) ACTIONS["modal-close"]();
});

/* drag-to-reorder: any table of rows carrying [data-drag-list]/[data-drag-id]
   (currently levels and streams). Reorder is computed from the rows' DOM
   order at drop time, then persisted by writing a fresh sort_order to every
   row in that list — simpler than tracking a running index across drags. */
let dragRow = null;
document.addEventListener("dragstart", ev => {
  const row = ev.target.closest("[data-drag-list]");
  if (!row) return;
  dragRow = row;
  ev.dataTransfer.effectAllowed = "move";
  ev.dataTransfer.setData("text/plain", row.dataset.dragId);
  row.classList.add("dragging");
});
document.addEventListener("dragover", ev => {
  const row = ev.target.closest("[data-drag-list]");
  if (!row || !dragRow || row.dataset.dragList !== dragRow.dataset.dragList) return;
  ev.preventDefault();
});
document.addEventListener("dragend", () => {
  if (dragRow) dragRow.classList.remove("dragging");
  dragRow = null;
});
document.addEventListener("drop", async ev => {
  const row = ev.target.closest("[data-drag-list]");
  if (!row || !dragRow || row.dataset.dragList !== dragRow.dataset.dragList || row === dragRow) return;
  ev.preventDefault();
  const list = dragRow.dataset.dragList;
  const rect = row.getBoundingClientRect();
  const after = ev.clientY > rect.top + rect.height / 2;
  row.insertAdjacentElement(after ? "afterend" : "beforebegin", dragRow);
  const ids = $$('[data-drag-list="' + list + '"]', row.closest("table")).map(r => r.dataset.dragId);
  try {
    await Promise.all(ids.map((id, i) => upd(list, id, { sort_order: i })));
    render();
  } catch (e) { fail(e); }
});

document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && $(".modal-scrim")) ACTIONS["modal-close"]();
  else if (ev.key === "Escape" && document.body.classList.contains("printing")) closePrint();
  if (ev.key === "Enter" && ev.target.closest(".gate-body") && ev.target.tagName === "INPUT") {
    const b = $(".gate-body .btn-lg"); if (b) b.click();
  }
});

document.addEventListener("keypress", ev => {
  if (ev.key === "Enter" && ev.target.closest(".sess")) ev.target.click();
});

document.addEventListener("change", ev => {
  if (ev.target.id === "f_progstudent") { state.progressStudent = ev.target.value; render(); }
});

window.addEventListener("hashchange", () => render());

/* ============================================================================
   BOOT
   ========================================================================== */
(async function boot() {
  if (!db) return renderConfigGate();

  db.auth.onAuthStateChange(async (event) => {
    if (event === "SIGNED_OUT") { state.user = null; state.profile = null; render(); }
  });

  try {
    await loadMe();
  } catch (e) {
    console.error(e);
    root().innerHTML = '<div class="gate"><div class="gate-card"><div class="gate-body">' +
      '<h2 style="margin-bottom:10px">Cannot reach the database</h2>' +
      "<p>" + esc(e.message || e) + "</p>" +
      "<p>Check the project URL and anon key, and make sure the setup SQL has been run.</p>" +
      '<button class="btn btn-ghost" data-act="reset-config">Change the connection details</button>' +
      "</div></div></div>";
    ACTIONS["reset-config"] = () => { store.del("sb_url"); store.del("sb_key"); location.reload(); };
    return;
  }

  /* returning from a HitPay redirect */
  const paid = new URLSearchParams(location.search).get("paid");
  if (paid) {
    toast("Payment received for " + paid + ". Credits appear once HitPay confirms.", "ok");
    history.replaceState({}, "", location.pathname + location.hash);
  }

  render();
})();
</script>
